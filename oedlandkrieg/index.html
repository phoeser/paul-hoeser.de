<title>Ödlandkrieg – Öl. Schrott. Krieg.</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

kbd{background:#3b2c1a;border:1px solid #8a6a3c;border-radius:4px;padding:0 5px;font-family:inherit;font-size:13px}

<body>
<div id="game">
  <div id="view">
    <canvas id="cv"></canvas>

<div id="start"><div class="inner">
  <div class="logo">ÖDLANDKRIEG</div>

  <div class="lbl">Karte</div>
  <div class="seg" id="segM"><button class="opt" data-v="48">Klein</button><button class="opt on" data-v="64">Mittel</button><button class="opt" data-v="84">Groß</button></div>
  <button class="big" id="bStart">⚔ Gefecht starten</button>
  <button class="big sec" id="bCamp" disabled>🎖 Kampagne – kommt in der nächsten Ausbaustufe</button>
  <button class="big sec" id="bHelp">📜 So wird gespielt</button>
</div></div>

<script>
"use strict";
/* ======================= Grunddaten ======================= */
const T=32;let MW=64,MH=64;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=Math.random,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
let seed=1;const srand=s=>{seed=(s>>>0)||1},sr=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const ARM={bullet:{inf:1,light:.55,heavy:.22,bld:.22},rocket:{inf:.4,light:1.15,heavy:1,bld:.9},cannon:{inf:.7,light:1,heavy:1,bld:1.1},melee:{inf:1.3,light:.85,heavy:.45,bld:.35},laser:{inf:1,light:1.1,heavy:1.1,bld:1}};
const U={
 inf:{hp:70,spd:34,rng:4.2,dmg:9,wpn:'bullet',cd:.9,cost:100,time:6,arm:'inf',r:6,sight:6.5,from:'bar'},
 rkt:{hp:60,spd:30,rng:5,dmg:34,wpn:'rocket',cd:2.3,cost:220,time:9,arm:'inf',r:6,sight:6.5,from:'bar'},
 fast:{hp:160,spd:85,rng:4,dmg:8,wpn:'bullet',cd:.4,cost:320,time:10,arm:'light',r:11,sight:7,from:'fac'},
 heavy:{hp:480,spd:32,rng:5.5,dmg:52,wpn:'cannon',cd:2.4,cost:700,time:18,arm:'heavy',r:15,sight:7,from:'fac',lvl:2},
 oil:{hp:280,spd:46,rng:0,dmg:0,cost:450,time:12,arm:'light',r:12,sight:5,from:'fac'},
 elite:{hp:950,spd:40,rng:6.5,dmg:75,wpn:'laser',cd:1.5,arm:'heavy',r:17,sight:8,cost:0}
};
const B={
 hq:{w:3,h:3,hp:2200,cost:0,time:0,sight:8},
 ref:{w:3,h:3,hp:1100,cost:800,time:14,sight:5,req:'hq'},
 der:{w:2,h:2,hp:550,cost:500,time:9,sight:5,req:'ref'},
 bar:{w:2,h:2,hp:750,cost:400,time:10,sight:5,req:'hq'},
 fac:{w:3,h:3,hp:1200,cost:1000,time:18,sight:5,req:'ref'},
 tow:{w:1,h:1,hp:700,cost:450,time:9,sight:7,req:'bar',rng:6,dmg:15,wpn:'bullet',cd:.55},
 tech:{w:2,h:2,hp:99999,sight:0}
};
const BORDER=['ref','der','bar','fac','tow'],UORDER=['inf','rkt','fast','heavy','oil'];
const FAC={
 bunker:{name:'Bunkerleute',
  u:{inf:'Gewehrschütze',rkt:'Bazooka-Trupp',fast:'Kampfbuggy',heavy:'Kettenpanzer',oil:'Tanklaster',elite:'Laser-Prototyp'},
  b:{hq:'Bunker-Kommando',ref:'Raffinerie',der:'Bohrturm',bar:'Kaserne',fac:'Panzerwerk',tow:'MG-Turm',tech:'Tech-Bunker'},
  mod:{}},
 mutant:{name:'Mutanten',
  u:{inf:'Plünderer',rkt:'Raketen-Irrer',fast:'Hyänenreiter',heavy:'Kriegsmammut',oil:'Ölochse',elite:'Riesenskorpion'},
  b:{hq:'Häuptlingsfestung',ref:'Ölkocherei',der:'Ölpumpe',bar:'Schlägergrube',fac:'Bestienzucht',tow:'Schrottturm',tech:'Tech-Bunker'},
  mod:{inf:{hp:88,cost:90,rng:3.6,dmg:11},rkt:{hp:74},fast:{wpn:'melee',rng:1.3,dmg:20,cd:.8,hp:180,spd:78},heavy:{hp:570,spd:29},elite:{wpn:'melee',rng:1.8,dmg:110,cd:1.3,hp:1050,spd:46}}}
};
const DIFF={easy:{inc:.5,first:480,wave:3,grow:1,mix:0,maxw:10,think:1.5,gap:150,name:'Leicht'},normal:{inc:.75,first:340,wave:4,grow:1,mix:.08,maxw:16,think:1.15,gap:110,name:'Normal'},hard:{inc:.95,first:240,wave:5,grow:2,mix:.18,maxw:22,think:1,gap:80,name:'Schwer'},brutal:{inc:1.25,first:170,wave:6,grow:2,mix:.28,maxw:28,think:.9,gap:60,name:'Brutal'}};
const COL=['#e6a92a','#c8352c'];
function stat(side,type){return Object.assign({},U[type],FAC[sides[side].fac].mod[type]||{})}

/* ======================= Zustand ======================= */
let tiles,occ,expl,vis,ents=[],nextId=1,sides=[],time=0,speed=1,paused=true,over=false,cfg={fac:'bunker',diff:'normal',size:64};
let terrainC,decalC,decalX,miniBase,camX=0,camY=0,zoom=1,sel=[],placing=null,atkMode=false,boxMode=false,groups={};
let projs=[],tracers=[],parts=[],pathQ=[],visT=0,aiT=0,msgT={};
const blocked=(x,y)=>x<0||y<0||x>=MW||y>=MH||tiles[y*MW+x]===1||occ[y*MW+x]>0;

/* ======================= Kartengenerator ======================= */
function noise2(w,h,sc){const gw=Math.ceil(w/sc)+2,gh=Math.ceil(h/sc)+2,g=[];for(let i=0;i<gw*gh;i++)g.push(sr());
  const f=t=>t*t*(3-2*t);return(x,y)=>{const gx=x/sc,gy=y/sc,ix=gx|0,iy=gy|0,fx=f(gx-ix),fy=f(gy-iy),a=g[iy*gw+ix],b=g[iy*gw+ix+1],c=g[(iy+1)*gw+ix],d=g[(iy+1)*gw+ix+1];return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}}
function genMap(){srand((Math.random()*1e9)|0);tiles=new Uint8Array(MW*MH);occ=new Int32Array(MW*MH);expl=new Uint8Array(MW*MH);vis=new Uint8Array(MW*MH);
  const n1=noise2(MW,MH,7),n2=noise2(MW,MH,3);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const v=n1(x,y)*.75+n2(x,y)*.25;if(v>.66||x===0||y===0||x===MW-1||y===MH-1)tiles[y*MW+x]=1}
  const m=8,swap=sr()<.5;const sA=swap?{x:MW-m-2,y:m}:{x:m,y:MH-m-2},sB=swap?{x:m,y:MH-m-2}:{x:MW-m-2,y:m};
  const clear=(cx,cy,r)=>{for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(x>0&&y>0&&x<MW-1&&y<MH-1&&Math.hypot(x-cx,y-cy)<=r)tiles[y*MW+x]=0};
  clear(sA.x,sA.y,9);clear(sB.x,sB.y,9);
  const fields=[],place=(x,y)=>{x=clamp(x|0,2,MW-4);y=clamp(y|0,2,MH-4);if(fields.some(f=>Math.abs(f.x-x)<5&&Math.abs(f.y-y)<5))return;clear(x+1,y+1,3);fields.push({x,y})};
  for(const s of[sA,sB]){const dx=Math.sign(MW/2-s.x),dy=Math.sign(MH/2-s.y);place(s.x+dx*6,s.y-dy*1);place(s.x-dx*2,s.y+dy*6);place(s.x+dx*7,s.y+dy*7)}
  const mid=Math.round(MW/2),cnt=MW>70?7:MW>50?5:3;
  for(let i=0;i<cnt;i++){const a=i/cnt*Math.PI*2+sr();place(mid+Math.cos(a)*MW*.18,mid+Math.sin(a)*MH*.18)}
  for(let i=0;i<cnt;i++)place(4+sr()*(MW-8),4+sr()*(MH-8));
  for(const f of fields)for(let y=f.y;y<f.y+2;y++)for(let x=f.x;x<f.x+2;x++)tiles[y*MW+x]=2;
  const techs=[];for(let i=0;i<(MW>70?3:2);i++){const a=sr()*Math.PI*2,r=MW*.08+sr()*MW*.12;const x=clamp((mid+Math.cos(a)*r)|0,4,MW-6),y=clamp((mid+Math.sin(a)*r)|0,4,MH-6);
    if(fields.some(f=>Math.abs(f.x-x)<4&&Math.abs(f.y-y)<4)||techs.some(t=>Math.abs(t.x-x)<6&&Math.abs(t.y-y)<6))continue;clear(x+1,y+1,3);techs.push({x,y})}
  // Verbindung sicherstellen
  const reach=()=>{const seen=new Uint8Array(MW*MH),q=[sA.y*MW+sA.x];seen[q[0]]=1;while(q.length){const i=q.pop(),x=i%MW,y=(i/MW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const j=(y+dy)*MW+x+dx;if(!seen[j]&&tiles[j]!==1){seen[j]=1;q.push(j)}}}return seen};
  const carve=(ax,ay,bx,by)=>{let x=ax,y=ay;let g=0;while((x!==bx||y!==by)&&g++<500){if(sr()<.5&&x!==bx)x+=Math.sign(bx-x);else if(y!==by)y+=Math.sign(by-y);else x+=Math.sign(bx-x);for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)if(xx>0&&yy>0&&xx<MW-1&&yy<MH-1&&tiles[yy*MW+xx]===1)tiles[yy*MW+xx]=0}};
  for(const t of[sB,...fields,...techs.map(t=>({x:t.x,y:t.y-1}))]){const s=reach();if(!s[t.y*MW+t.x])carve(sA.x,sA.y,t.x,t.y)}
  return{sA,sB,fields,techs}}

/* ======================= Gelände zeichnen ======================= */
function renderTerrain(){const W=MW*T,H=MH*T;terrainC=document.createElement('canvas');terrainC.width=W;terrainC.height=H;const c=terrainC.getContext('2d');
  const n=noise2(W+8,H+8,90),n2=noise2(W,H,18),n3=noise2(W,H,260);srand(4242);
  const img=c.createImageData(W,H),d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=n(x,y),w=n2(x,y),z=n3(x,y),lt=(n(x+6,y+6)-v)*-260,s=(Math.random()-.5)*12,i=(y*W+x)*4;
    const L=1+clamp(lt*.45,-.09,.09);
    d[i]=(146+v*52+w*14+z*22+s)*L;d[i+1]=(116+v*40+w*10-z*6+s)*L;d[i+2]=(74+v*24+w*6-z*16+s)*L;d[i+3]=255}
  c.putImageData(img,0,0);
  // Risse
  c.strokeStyle='rgba(60,40,20,.35)';c.lineWidth=1;for(let i=0;i<MW*MH/6;i++){let x=sr()*W,y=sr()*H;c.beginPath();c.moveTo(x,y);for(let k=0;k<5;k++){x+=(sr()-.5)*26;y+=(sr()-.5)*26;c.lineTo(x,y)}c.stroke()}
  // Krater & Schutt
  for(let i=0;i<MW*MH/55;i++){const x=sr()*W,y=sr()*H,r=8+sr()*22;const g=c.createRadialGradient(x,y,r*.2,x,y,r);g.addColorStop(0,'rgba(50,35,20,.55)');g.addColorStop(.7,'rgba(70,50,30,.25)');g.addColorStop(.85,'rgba(200,170,120,.25)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
  // Fels: Umgebungsschatten und Schlagschatten
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(tiles[y*MW+x]===1){const cx=x*T+16,cy=y*T+16;const g=c.createRadialGradient(cx+6,cy+8,4,cx+6,cy+8,34);g.addColorStop(0,'rgba(35,22,10,.55)');g.addColorStop(1,'rgba(35,22,10,0)');c.fillStyle=g;c.beginPath();c.arc(cx+6,cy+8,34,0,7);c.fill()}
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(tiles[y*MW+x]===1){for(let k=0;k<3;k++){const cx=x*T+6+sr()*20,cy=y*T+6+sr()*20,r=11+sr()*9;
      const g=c.createRadialGradient(cx-r*.35,cy-r*.4,r*.1,cx,cy,r);const b=90+sr()*30;g.addColorStop(0,`rgb(${b+60},${b+45},${b+28})`);g.addColorStop(.6,`rgb(${b},${b-12},${b-28})`);g.addColorStop(1,`rgb(${b-45},${b-55},${b-65})`);
      c.fillStyle=g;c.beginPath();c.ellipse(cx,cy,r,r*.85,sr()*3,0,7);c.fill();

  if(u.st==='manual'){if(!u.path&&!pathQ.includes(u))u.st='idle';return}
  if(u.st==='idle'||!alive(u.der)&&u.st!=='toRef'&&u.st!=='unload'){const ds=own(u.side,'der').filter(d=>d.oil>0);let best=null,bd=1e9;
    for(const d of ds){const n=units(u.side,'oil').filter(o=>o.der===d&&o!==u).length;const dd=dist(u.x,u.y,d.x,d.y)+n*400;if(n<3&&dd<bd){bd=dd;best=d}}
    u.der=best;if(best){if(u.load>=200){u.st='toRef'}else{u.st='toDer';const t=dock(best);u.gx=t.x*T+16;u.gy=t.y*T+16;reqPath(u,t.x,t.y)}}else if(u.load>0){u.st='toRef'}else{u.st='wait';u.stT=2}}
  if(u.st==='wait'&&u.stT<=0)u.st='idle';
  if(u.st==='toDer'){if(!u.der){u.st='idle';return}if(edgeDist(u,u.der)<T*.8){u.st='load';u.stT=2.5;u.path=null}else if(!u.path&&!pathQ.includes(u)){const t=dock(u.der);reqPath(u,t.x,t.y)}}
  if(u.st==='load'&&u.stT<=0){const amt=Math.min(200,u.der?u.der.oil:0);if(u.der)u.der.oil-=amt;u.load=amt;u.st='toRef'}
  if(u.st==='toRef'){const rs=own(u.side,'ref');if(!rs.length){u.st='wait';u.stT=3;return}let r=rs.reduce((a,b)=>dist(u.x,u.y,a.x,a.y)<dist(u.x,u.y,b.x,b.y)?a:b);u.ref=r;
    if(edgeDist(u,r)<T*.8){u.st='unload';u.stT=1.5;u.path=null}else if(!u.path&&!pathQ.includes(u)){const t=dock(r);reqPath(u,t.x,t.y)}}
  if(u.st==='unload'&&u.stT<=0){if(alive(u.ref)){const inc=u.load*(u.side===1&&sides[1].ai?DIFF[cfg.diff].inc:1);S.money+=Math.round(inc);S.stats.oil+=Math.round(inc);if(u.side===0&&onScreen(u.x,u.y))floatTxt(u.ref.x,u.ref.y-30,'+'+Math.round(inc),'#ffcf5a')}u.load=0;u.st='idle'}}
function dock(b){let best=null,bd=1e9;for(let y=b.ty-1;y<=b.ty+b.h;y++)for(let x=b.tx-1;x<=b.tx+b.w;x++){if(blocked(x,y))continue;const d=Math.abs(y-(b.ty+b.h))*0.5+Math.abs(x-(b.tx+b.w/2));if(d<bd){bd=d;best={x,y}}}return best||{x:b.tx,y:b.ty+b.h}}
function openBunker(b,u){b.opened=true;const S=sides[u.side];const n=cfg.size>70?2:1;
  for(let i=0;i<n;i++){const f=nearestFree(b.tx+1,b.ty+b.h+1,5);if(f){const e=addUnit(u.side,'elite',f.x*T+16,f.y*T+16);e.vet=1}}
  for(const o of ents)if(o.bunker===b)o.bunker=null;
  boom(b.x,b.y,14);if(u.side===0)say(`Tech-Bunker geöffnet – ${FAC[S.fac].u.elite} erbeutet!`);else if(isVisTo(0,b))say('Der Feind hat einen Tech-Bunker geplündert!','bad')}
function updBld(b,dt){b.anim+=dt;const d=B[b.type];
  if(d.wpn){b.cd-=dt;if(b.tgt&&(b.tgt.dead||edgeDist(b,b.tgt)>d.rng*T||!isVisTo(b.side,b.tgt)))b.tgt=null;if(!b.tgt&&(b.acqT=(b.acqT||0)-dt)<=0){b.acqT=.4;b.tgt=acquire(b,d.rng)}
    if(b.tgt){const a=Math.atan2(b.tgt.y-b.y,b.tgt.x-b.x);b.tdir=turn(b.tdir,a,dt*5);if(b.cd<=0&&Math.abs(angDiff(b.tdir,a))<.3){fire(b,b.tgt);b.cd=d.cd}}}
  if(b.hp<b.max*.5&&rnd()<dt*6)parts.push({x:b.x+(rnd()-.5)*b.w*T*.6,y:b.y+(rnd()-.5)*b.h*T*.6,vx:4,vy:-18,l:1.6,m:1.6,t:b.hp<b.max*.25&&rnd()<.5?'fire':'smoke',r:5});
  if((b.type==='ref'||b.type==='hq')&&rnd()<dt*2.5)parts.push({x:b.tx*T+(b.type==='ref'?20:b.w*T-14),y:b.ty*T+6,vx:6,vy:-14,l:2.2,m:2.2,t:'smoke',r:4})}

function reqOK(S,type){const d=B[type]||U[type];if(type==='heavy'&&S.lvl<2)return false;if(B[type]){return !d.req||own(S.id,d.req).length>0}return own(S.id,U[type].from).length>0}
function reqText(S,type){if(type==='heavy'&&S.lvl<2)return 'braucht Ausbau der Zentrale';const d=B[type];if(d)return 'braucht '+FAC[S.fac].b[d.req];return 'braucht '+FAC[S.fac].b[U[type].from]}
function startBuild(S,type){if(S.bq||!reqOK(S,type))return false;const c=B[type].cost;if(S.money<c){if(S.id===0)say('Zu wenig Öl-Dollar!','bad');return false}S.money-=c;S.bq={type,t:0,total:B[type].time};return true}
function queueUnit(S,type){if(!reqOK(S,type))return false;const st=stat(S.id,type);if(S.money<st.cost){if(S.id===0)say('Zu wenig Öl-Dollar!','bad');return false}
  const q=S.uq[st.from];if(q.length>=10)return false;S.money-=st.cost;q.push({type,t:0,total:st.time});return true}
function updProd(S,dt){if(S.bq&&!S.bq.done){S.bq.t+=dt;if(S.bq.t>=S.bq.total){S.bq.done=true;if(S.id===0){say('Gebäude bereit – jetzt platzieren');tab='b';buildUI()}}}
  for(const pf of['bar','fac']){const q=S.uq[pf],ps=own(S.id,pf);if(!q.length||!ps.length)continue;q[0].t+=dt*(1+(ps.length-1)*.5);
    if(q[0].t>=q[0].total){const it=q.shift();const p=ps[(S.rot=(S.rot||0)+1)%ps.length];const f=nearestFree(p.tx+(p.w>>1),p.ty+p.h,6)||{x:p.tx,y:p.ty+p.h};
      const u=addUnit(S.id,it.type,f.x*T+16,f.y*T+16);if(p.rally)cmdMove([u],p.rally.x,p.rally.y,it.type==='oil'?'move':'amove');if(S.id===0)say(`${FAC[S.fac].u[it.type]} bereit`,'',true)}}
  if(S.upg){S.upg.t+=dt;if(S.upg.t>=S.upg.total){S.upg=null;S.lvl=2;for(const h of own(S.id,'hq')){h.max*=1.3;h.hp*=1.3}if(S.id===0)say('Zentrale ausgebaut – schwere Einheiten verfügbar!')}}}
function canPlace(S,type,tx,ty){const d=B[type];if(tx<1||ty<1||tx+d.w>MW-1||ty+d.h>MH-1)return false;
  for(let y=ty;y<ty+d.h;y++)for(let x=tx;x<tx+d.w;x++){const t=tiles[y*MW+x];if(t===1||occ[y*MW+x])return false;if(type==='der'?t!==2:t===2)return false}
  if(type==='der')return S.id!==0||expl[ty*MW+tx]||cfg.reveal;
  for(const b of own(S.id))if(tx<=b.tx+b.w+6&&tx+d.w>=b.tx-6&&ty<=b.ty+b.h+6&&ty+d.h>=b.ty-6)return true;return false}
function place(S,tx,ty){const type=S.bq.type;if(!canPlace(S,type,tx,ty))return false;const b=addBld(S.id,type,tx,ty);S.bq=null;S.stats.built++;
  if(type==='ref'||type==='der'){const d=dock(b);const f=nearestFree(d.x,d.y,5);if(f){const u=addUnit(S.id,'oil',f.x*T+16,f.y*T+16);if(type==='der')u.der=b}}
  sfx('place',b.x,b.y);return true}

/* ======================= Computer-Gegner ======================= */
function updAI(S,dt){const D=DIFF[cfg.diff];if(S.human)return;
  const hq=own(S.id,'hq')[0]||own(S.id)[0];if(!hq)return;
  const has=t=>own(S.id,t).length,ders=own(S.id,'der');
  // Bauen
  if(!S.bq){let want=null;
    if(!has('ref'))want='ref';else if(ders.length<1)want='der';else if(!has('bar'))want='bar';else if(ders.length<2&&freeOil(S).length)want='der';else if(!has('fac'))want='fac';
    else if(has('tow')<1)want='tow';else if(ders.length<4&&freeOil(S).length&&S.money>500)want='der';else if(has('tow')<2+(cfg.diff==='brutal'?2:0)&&time>240)want='tow';
    else if(S.money>1800&&has('bar')<2)want='bar';else if(S.money>2200&&has('fac')<2)want='fac';else if(S.money>1500&&has('ref')<2&&ders.length>=3)want='ref';
    else if(freeOil(S).length&&S.money>900&&ders.length<7)want='der';
    S.want=want;if(want)startBuild(S,want)}
  if(S.bq&&S.bq.done){const spot=aiSpot(S,S.bq.type,hq);if(spot)place(S,spot.x,spot.y);else if(S.bq.type==='der'){S.money+=B.der.cost;S.bq=null}}
  if(S.lvl<2&&!S.upg&&has('fac')&&(S.money>1300||time>420&&S.money>=1200)){S.money-=1200;S.upg={t:0,total:30}}
  const armyN=units(S.id).filter(u=>u.type!=='oil').length;
  const saving=(S.want&&!S.bq&&S.money<B[S.want].cost)||(S.lvl<2&&has('fac')&&!S.upg&&time>300);
  const reserve=saving&&armyN>=5?99999:0;
  // Truppen
  const tk=units(S.id,'oil').length+S.uq.fac.filter(q=>q.type==='oil').length;
  if(has('fac')&&tk<Math.min(ders.length+Math.floor(ders.length/2)+1,10)&&S.uq.fac.length<2&&S.money>600)queueUnit(S,'oil');
  const mix=()=>{const r=rnd();if(S.lvl>=2&&r<.22+D.mix*.3)return'heavy';if(r<.45)return'inf';if(r<.7)return'rkt';return'fast'};
  for(let k=0;k<2;k++){const t=mix();const from=U[t].from;if(has(from)&&S.uq[from].length<2&&S.money>stat(S.id,t).cost+150+reserve)queueUnit(S,t)}
  // Rallypunkt vor der Basis
  const army=units(S.id).filter(u=>u.type!=='oil'&&u.type!=='elite'||u.type==='elite');
  const idle=army.filter(u=>!u.wave&&u.ord!=='attack');
  const enemyB=own(0).concat(own(1)).filter(b=>b.side!==S.id);
  // Verteidigung
  if(S.lastAtk&&time-S.lastAtk.t<3){for(const u of idle){if(dist(u.x,u.y,S.lastAtk.x,S.lastAtk.y)<16*T&&!u.tgt){u.ord='amove';u.gx=S.lastAtk.x;u.gy=S.lastAtk.y;reqPath(u,(u.gx/T)|0,(u.gy/T)|0)}}}
  // Angriffswelle
  S.wave=S.wave||D.wave;
  if(time>D.first&&time-(S.lastWave||-999)>D.gap&&idle.length>=S.wave&&enemyB.length){const tgt=enemyB.reduce((a,b)=>dist(hq.x,hq.y,a.x,a.y)<dist(hq.x,hq.y,b.x,b.y)?a:b);
    const grp=idle.slice(0,S.wave+2);for(const u of grp){u.wave=1}cmdMove(grp,tgt.x,tgt.y,'amove');S.wave=Math.min(D.maxw,S.wave+D.grow);S.lastWave=time}
  // Wellen, die am Ziel stehen, weiter schicken
  for(const u of army)if(u.wave&&!u.tgt&&!u.path&&!pathQ.includes(u)&&enemyB.length){const t=enemyB.reduce((a,b)=>dist(u.x,u.y,a.x,a.y)<dist(u.x,u.y,b.x,b.y)?a:b);cmdMove([u],t.x,t.y,'amove')}
  // Sammelpunkt
  for(const u of idle)if(!u.path&&!u.tgt&&!u.rallied){u.rallied=1;const ex=enemyB[0];if(ex){const a=Math.atan2(ex.y-hq.y,ex.x-hq.x);cmdMove([u],hq.x+Math.cos(a)*5*T+(rnd()-.5)*96,hq.y+Math.sin(a)*5*T+(rnd()-.5)*96,'amove')}}
  // Tech-Bunker
  if(time>120&&!S.scout){const tb=ents.find(e=>e.type==='tech'&&!e.opened);const sc=units(S.id,'inf')[0]||units(S.id,'fast')[0];if(tb&&sc&&sc.s.arm==='inf'){S.scout=1;sc.wave=1;sc.bunker=tb;cmdMove([sc],tb.x,tb.y+T*1.5,'move')}}}
function freeOil(S){const r=[];for(let y=1;y<MH-2;y++)for(let x=1;x<MW-2;x++)if(tiles[y*MW+x]===2&&tiles[y*MW+x-1]!==2&&tiles[(y-1)*MW+x]!==2&&!occ[y*MW+x])r.push({x,y});
  const hq=own(S.id,'hq')[0]||own(S.id)[0];if(!hq)return[];const en=own(1-S.id);
  return r.filter(f=>!en.some(b=>Math.hypot(b.tx-f.x,b.ty-f.y)<8)).sort((a,b)=>Math.hypot(a.x-hq.tx,a.y-hq.ty)-Math.hypot(b.x-hq.tx,b.y-hq.ty))}
function aiSpot(S,type,hq){if(type==='der'){const f=freeOil(S)[0];return f&&canPlace(S,'der',f.x,f.y)?f:null}
  const en=own(1-S.id)[0]||{x:MW*T/2,y:MH*T/2};const a=Math.atan2(en.y-hq.y,en.x-hq.x);
  for(let r=3;r<12;r++)for(let k=0;k<24;k++){const ang=type==='tow'?a+(k%2?1:-1)*Math.floor(k/2)*.25:k/24*Math.PI*2+rnd()*.2;const x=Math.round(hq.tx+1+Math.cos(ang)*r),y=Math.round(hq.ty+1+Math.sin(ang)*r);
    if(canPlace(S,type,x,y)){let gap=true;const d=B[type];for(let yy=y-1;yy<=y+d.h&&gap;yy++)for(let xx=x-1;xx<=x+d.w;xx++)if(occ[yy*MW+xx]){gap=false;break}if(gap||type==='tow')return{x,y}}}return null}

/* ======================= Effekte ======================= */
function boom(x,y,s,big,small){for(let i=0;i<(small?5:s);i++){const a=rnd()*7,v=rnd()*s*4;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+rnd()*.4,m:.9,t:'fire',r:s*.35+rnd()*s*.3})}
  for(let i=0;i<(small?2:s*.6);i++)parts.push({x:x+(rnd()-.5)*s,y:y+(rnd()-.5)*s,vx:(rnd()-.5)*12,vy:-10-rnd()*10,l:1.5+rnd(),m:2.5,t:'smoke',r:s*.4+4});
  if(!small)for(let i=0;i<s*.5;i++){const a=rnd()*7,v=40+rnd()*120;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+rnd()*.5,m:1,t:'debris',r:2})}
  flash(x,y,Math.min(36,s*1.6));decalScorch(x,y,small?6:s*1.1);sfx(big?'bigboom':small?'hit':'boom',x,y)}
function flash(x,y,r,c){parts.push({x,y,vx:0,vy:0,l:.08,m:.08,t:'flash',r,c:c||'#fff2b0'})}
function floatTxt(x,y,txt,c){parts.push({x,y,vx:0,vy:-22,l:1.4,m:1.4,t:'txt',txt,c})}
function decalScorch(x,y,r){const g=decalX.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(20,12,6,.55)');g.addColorStop(1,'rgba(20,12,6,0)');decalX.fillStyle=g;decalX.beginPath();decalX.arc(x,y,r,0,7);decalX.fill()}
function decalBlood(x,y,r){for(let i=0;i<7;i++){decalX.fillStyle=`rgba(${110+rnd()*40|0},10,8,${.5+rnd()*.3})`;decalX.beginPath();decalX.ellipse(x+(rnd()-.5)*r*2.2,y+(rnd()-.5)*r*2.2,1+rnd()*r*.7,1+rnd()*r*.5,rnd()*3,0,7);decalX.fill()}
  decalX.fillStyle='rgba(60,45,35,.9)';decalX.beginPath();decalX.ellipse(x,y,r*.7,r*.35,rnd()*3,0,7);decalX.fill();for(let i=0;i<6;i++)parts.push({x,y,vx:(rnd()-.5)*60,vy:(rnd()-.5)*60,l:.35,m:.35,t:'blood',r:2})}
function decalWreck(u){decalScorch(u.x,u.y,u.s.r*1.8);decalX.save();decalX.translate(u.x,u.y);decalX.rotate(u.dir);decalX.fillStyle='rgba(28,22,18,.92)';const r=u.s.r;decalX.fillRect(-r,-r*.65,r*2,r*1.3);decalX.fillStyle='rgba(60,40,28,.9)';decalX.fillRect(-r*.4,-r*.4,r*.8,r*.8);decalX.restore()}
function decalRubble(b){const x0=b.tx*T,y0=b.ty*T,w=b.w*T,h=b.h*T;decalScorch(b.x,b.y,Math.max(w,h)*.8);for(let i=0;i<b.w*b.h*10;i++){decalX.fillStyle=`rgba(${50+rnd()*40|0},${40+rnd()*30|0},${30+rnd()*20|0},.95)`;decalX.fillRect(x0+rnd()*w,y0+rnd()*h,3+rnd()*7,3+rnd()*6)}}
function updParts(dt){for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='debris'||p.t==='blood'){p.vx*=.92;p.vy*=.92}if(p.t==='smoke'||p.t==='dust'){p.r+=dt*6}}parts=parts.filter(p=>p.l>0);if(parts.length>1400)parts.splice(0,parts.length-1400);
  for(const t of tracers)t.l-=dt;tracers=tracers.filter(t=>t.l>0)}

let AC=null,soundOn=true,voiceOn=true,sfxCount={};
function sfx(kind,x,y){if(!soundOn||paused)return;if(x!=null&&!onScreen(x,y,200))return;const now=performance.now();if((sfxCount[kind]||0)>now)return;sfxCount[kind]=now+({rifle:45,mg:35,die:90,boom:60,hit:40,bite:60}[kind]||80);
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,out=AC.createGain();out.gain.value=.5;out.connect(AC.destination);
    const noise=(len,f,q,v,type='bandpass')=>{const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(rnd()*2-1)*Math.pow(1-i/d.length,2);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.value=v;s.buffer=b;s.connect(fl).connect(g).connect(out);s.start(t)};
    const tone=(f1,f2,len,v,w='square')=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+len);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g).connect(out);o.start(t);o.stop(t+len)};
    if(kind==='rifle')noise(.09,2200,1.2,.5);else if(kind==='mg')noise(.06,1600,1,.45);else if(kind==='rocket'){noise(.35,800,.7,.35);tone(300,90,.3,.05,'sawtooth')}
    else if(kind==='cannon'){noise(.3,300,.6,1,'lowpass');tone(120,40,.25,.2,'sine')}else if(kind==='laser')tone(1800,200,.25,.12,'sawtooth');
    else if(kind==='boom'){noise(.6,240,.5,1,'lowpass');tone(90,30,.5,.25,'sine')}else if(kind==='bigboom'){noise(1.4,160,.4,1.4,'lowpass');tone(70,20,1.2,.4,'sine')}
    else if(kind==='hit')noise(.2,500,.6,.6,'lowpass');else if(kind==='die'){tone(260,90,.22,.06,'sawtooth')}else if(kind==='bite')noise(.12,900,2,.5);
    else if(kind==='place'){tone(140,70,.3,.2,'square');noise(.3,400,.5,.5,'lowpass')}else if(kind==='click')tone(900,700,.05,.05,'square');
    else if(kind==='ready')[[523,.0],[659,.08]].forEach(([f,dl])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.05,t+dl);g.gain.exponentialRampToValueAtTime(.001,t+dl+.15);o.connect(g).connect(out);o.start(t+dl);o.stop(t+dl+.16)})}catch(e){}}
let lastSay=0;
function say(txt,cls,quiet){const m=document.createElement('div');m.className='msg '+(cls||'');m.textContent=txt;const box=$('msgs');box.appendChild(m);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>m.remove(),4500);
  if(!quiet)sfx('ready');
  if(voiceOn&&!quiet&&window.speechSynthesis&&performance.now()-lastSay>1500){lastSay=performance.now();try{const u=new SpeechSynthesisUtterance(txt.replace(/–.*$/,'').replace(/★/g,''));u.lang='de-DE';u.rate=1.08;u.pitch=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
function warnAttack(b){if(time-(msgT.atk||-99)>15){msgT.atk=time;say('Unsere Basis wird angegriffen!','bad');sides[0].alarm={x:b.x,y:b.y,t:time}}}

const cv=$('cv'),ctx=cv.getContext('2d');let DC=ctx;const mini=$('mini'),mctx=mini.getContext('2d');let CW=0,CH=0,DPR=1;

  const w=toWorld(e.offsetX,e.offsetY);

  if(e.button===2){if(placing){placing=null;return}if(atkMode){atkMode=false;updTop();return}command(w.x,w.y);return}
  drag={sx:e.offsetX,sy:e.offsetY,cx:e.offsetX,cy:e.offsetY,box:false,touch:e.pointerType!=='mouse',shift:e.shiftKey,ctrl:e.ctrlKey}});
cv.addEventListener('pointermove',e=>{mouse={x:e.offsetX,y:e.offsetY};mouseIn=true;hover=toWorld(e.offsetX,e.offsetY);if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pinch&&ptrs.size===2){const[p1,p2]=[...ptrs.values()];const d=dist(p1.x,p1.y,p2.x,p2.y),cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2;const wz=clamp(pinch.z*d/pinch.d,.55,1.8);
    const wx=pinch.cam.x+pinch.cx/pinch.z,wy=pinch.cam.y+pinch.cy/pinch.z;zoom=wz;camX=wx-cx/zoom;camY=wy-cy/zoom;clampCam();return}
  if(!drag)return;if(drag.pan){camX=drag.cam.x-(e.offsetX-drag.sx)/zoom;camY=drag.cam.y-(e.offsetY-drag.sy)/zoom;clampCam();return}
  drag.cx=e.offsetX;drag.cy=e.offsetY;if(!drag.box&&dist(drag.sx,drag.sy,drag.cx,drag.cy)>8){
    if(drag.touch&&!boxMode){drag.pan=true;drag.cam={x:camX,y:camY};return}drag.box=true}});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;drag=null;return}if(!drag)return;const d=drag;drag=null;if(d.pan)return;
  const w=toWorld(d.cx,d.cy);
  if(d.box){boxSelect(toWorld(d.sx,d.sy),w);if(boxMode){boxMode=false;updTop()}return}
  if(placing){const S=sides[0],B0=B[placing];const tx=Math.floor(w.x/T-B0.w/2+.5),ty=Math.floor(w.y/T-B0.h/2+.5);if(place(S,tx,ty)){placing=null;updUI(true)}else say('Hier kann nicht gebaut werden','bad',true);return}
  if(atkMode){command(w.x,w.y,true);atkMode=false;updTop();return}
  const now=performance.now(),e2=entAt(w.x,w.y),dbl=now-lastTap.t<350&&e2&&lastTap.id===e2.id;lastTap={t:now,id:e2?e2.id:0};
  if(d.touch){const mine=sel.filter(x=>x.side===0&&x.k==='u'&&!x.dead);if(e2&&e2.side===0&&!(mine.length&&e2.k==='b'&&e2.type==='der'&&mine.some(u=>u.type==='oil'))){selectAt(w.x,w.y,false,dbl);return}
    if(mine.length||sel.some(x=>x.side===0&&x.k==='b'&&(x.type==='bar'||x.type==='fac'))){command(w.x,w.y);return}selectAt(w.x,w.y,false,false);return}
  selectAt(w.x,w.y,d.shift,dbl)});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener('pointerleave',()=>{mouseIn=false});
cv.addEventListener('wheel',e=>{e.preventDefault();const w=toWorld(e.offsetX,e.offsetY);zoom=clamp(zoom*(e.deltaY<0?1.12:1/1.12),.55,1.8);camX=w.x-e.offsetX/zoom;camY=w.y-e.offsetY/zoom;clampCam()},{passive:false});
let miniDrag=false;
const miniPos=e=>{const r=mini.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*MW*T,y:(e.clientY-r.top)/r.height*MH*T}};
mini.addEventListener('contextmenu',e=>e.preventDefault());
mini.addEventListener('pointerdown',e=>{if(paused)return;const p=miniPos(e);if(e.button===2){command(p.x,p.y);return}miniDrag=true;mini.setPointerCapture(e.pointerId);camX=p.x-viewW()/2;camY=p.y-viewH()/2;clampCam()});
mini.addEventListener('pointermove',e=>{if(!miniDrag)return;const p=miniPos(e);camX=p.x-viewW()/2;camY=p.y-viewH()/2;clampCam()});
mini.addEventListener('pointerup',()=>miniDrag=false);
window.addEventListener('keydown',e=>{if($('start').classList.contains('hidden')===false)return;keys[e.key]=true;const k=e.key.toLowerCase();
  if(k==='escape'||k==='p'){if(placing){placing=null;return}if(atkMode){atkMode=false;updTop();return}togglePause();return}
  if(paused)return;
  if(k==='a'){atkMode=!atkMode;updTop()}else if(k==='s'){stopSel()}else if(k==='h'){home()}
  else if(/^[1-9]$/.test(k)){if(e.ctrlKey){e.preventDefault();groups[k]=sel.filter(x=>x.k==='u');say(`Gruppe ${k} gespeichert`,'',true)}else if(groups[k]){const g=groups[k].filter(x=>!x.dead);if(sel.length===g.length&&sel.every(x=>g.includes(x))&&g.length){camX=g[0].x-viewW()/2;camY=g[0].y-viewH()/2;clampCam()}sel=g;infoUI()}}});
window.addEventListener('keyup',e=>{keys[e.key]=false});
function stopSel(){for(const u of sel)if(u.k==='u'&&u.side===0){u.path=null;u.ord=null;u.tgt=null}}
function home(){const h=own(0,'hq')[0]||own(0)[0]||units(0)[0];if(h){camX=h.x-viewW()/2;camY=h.y-viewH()/2;clampCam()}}
function updTop(){$('tAtk').classList.toggle('on',atkMode);$('tBox').classList.toggle('on',boxMode)}
$('tAtk').onclick=()=>{atkMode=!atkMode;updTop()};$('tStop').onclick=stopSel;$('tHome').onclick=home;$('tBox').onclick=()=>{boxMode=!boxMode;updTop()};$('tMenu').onclick=()=>togglePause();

/* ======================= Ablauf ======================= */
function newGame(){MW=MH=cfg.size;ents=[];nextId=1;projs=[];tracers=[];parts=[];pathQ=[];sel=[];marks=[];groups={};time=0;over=false;placing=null;atkMode=false;msgT={};
  const ai=['bunker','mutant'].find(f=>f!==cfg.fac);
  sides=[{id:0,fac:cfg.fac,human:true,money:2600,lvl:1,bq:null,uq:{bar:[],fac:[]},upg:null,stats:{kills:0,lost:0,blost:0,built:0,oil:0,made:0}},
         {id:1,fac:ai,ai:true,money:2000,lvl:1,bq:null,uq:{bar:[],fac:[]},upg:null,stats:{kills:0,lost:0,blost:0,built:0,oil:0,made:0}}];
  if(cfg.demo)sides[0].human=false;
  const m=genMap();renderTerrain();iconCacheClear();
  for(const[s,p]of[[0,m.sA],[1,m.sB]]){const hq=addBld(s,'hq',p.x-1,p.y-1);hq.born=-9;const ut=['inf','inf','inf','rkt'];ut.forEach((t,i)=>{const f=nearestFree(p.x+2+i%2,p.y+3+(i>>1),4);if(f)addUnit(s,t,f.x*T+16,f.y*T+16)})}
  for(const t of m.techs){const b=addBld(-1,'tech',t.x,t.y);b.born=-9}
  for(const e of ents)e.born=-9;
  resize();zoom=CW>700?1.35:1.1;clampCam();home();computeVis();buildUI();paused=false}
function iconCacheClear(){for(const k in iconCache)delete iconCache[k]}
function togglePause(){if(over)return;paused=!paused;if(paused)showMenu();else $('overlay').classList.add('hidden')}
function showMenu(){const p=$('panel');$('overlay').classList.remove('hidden');
  p.innerHTML=`<h2>Pause</h2><div class="row"><button class="sbtn" id="mRes">▶ Weiter</button></div>
   <div class="row"><button class="sbtn" id="mSpd">⏩ Tempo: ${speed===1?'Normal':speed>1?'Schnell':'Langsam'}</button><button class="sbtn" id="mSnd">${soundOn?'🔊 Ton an':'🔇 Ton aus'}</button></div>
   <div class="row"><button class="sbtn" id="mVoc">${voiceOn?'🗣 Ansagen an':'🤐 Ansagen aus'}</button><button class="sbtn" id="mHelp">📜 Hilfe</button></div>
   <div class="row"><button class="sbtn" id="mNew">🔁 Neues Gefecht</button><button class="sbtn" id="mQuit">🏳 Aufgeben</button></div>`;
  $('mRes').onclick=()=>togglePause();$('mSpd').onclick=()=>{speed=speed===1?1.5:speed>1?.7:1;showMenu()};$('mSnd').onclick=()=>{soundOn=!soundOn;showMenu()};$('mVoc').onclick=()=>{voiceOn=!voiceOn;showMenu()};
  $('mHelp').onclick=()=>showHelp(showMenu);$('mNew').onclick=()=>{$('overlay').classList.add('hidden');$('start').classList.remove('hidden');paused=true};$('mQuit').onclick=()=>{$('overlay').classList.add('hidden');paused=false;endGame(false,'Du hast aufgegeben.')}}
const HELP=`<h2>So wird gespielt</h2><ul>
<li><b>Ziel:</b> Zerstöre alle Gebäude des Gegners, bevor er deine zerstört.</li>
<li><b>Öl ist alles:</b> Baue eine Raffinerie (bringt einen Tanklaster mit) und Bohrtürme auf die schwarzen Ölfelder. Die Laster fahren das Öl automatisch zur Raffinerie – das bringt Öl-Dollar.</li>
<li><b>Bauen:</b> Rechts ein Gebäude anklicken, warten bis „PLATZIEREN“ blinkt, dann Bauplatz in der Nähe deiner Basis wählen. Bohrtürme gehen auf jedes erkundete Ölfeld.</li>
<li><b>Truppen:</b> Im Reiter „Truppen“ ausbilden. Schwere Einheiten brauchen den Ausbau der Zentrale (Zentrale anklicken → Ausbau).</li>
<li><b>Steuern (Maus):</b> Linksklick wählt aus, Rahmen ziehen wählt mehrere, Doppelklick wählt alle gleichen. Rechtsklick bewegt bzw. greift an. Mausrad zoomt, Bildschirmrand/Pfeiltasten/Mitteltaste scrollen.</li>
<li><b>Tablet:</b> Antippen wählt aus, danach auf den Boden oder einen Feind tippen. Mit einem Finger ziehen scrollt, mit ⬚ ziehst du einen Auswahlrahmen, zwei Finger zoomen.</li>
<li><b>Tasten:</b> <kbd>A</kbd> Angriffsbewegung, <kbd>S</kbd> Stopp, <kbd>H</kbd> zur Basis, <kbd>Strg</kbd>+<kbd>1–9</kbd> Gruppe speichern, <kbd>1–9</kbd> Gruppe wählen, <kbd>Esc</kbd> Pause.</li>
<li><b>Tech-Bunker</b> ☢: Schick Fußsoldaten hin – darin wartet eine mächtige Spezialeinheit.</li>
<li><b>Erfahrung:</b> Einheiten mit Abschüssen bekommen Sterne und werden stärker.</li>
<li><b>Waffen:</b> Gewehre gegen Fußvolk, Raketen und Kanonen gegen Fahrzeuge, Bestien und Gebäude.</li></ul>`;
function showHelp(back){const p=$('panel');$('overlay').classList.remove('hidden');p.innerHTML=HELP+`<button class="sbtn" id="hBack">Zurück</button>`;$('hBack').onclick=()=>{if(back)back();else $('overlay').classList.add('hidden')}}
function endGame(win,why){if(over)return;over=true;const S=sides[0],E=sides[1];const mm=Math.floor(time/60),ss=String(Math.floor(time%60)).padStart(2,'0');
  say(win?'Sieg!':'Niederlage!',win?'':'bad');const p=$('panel');$('overlay').classList.remove('hidden');
  p.innerHTML=`<h2>${win?'🏆 Sieg!':'💀 Niederlage'}</h2><p>${why}</p><table class="st"><tr><td>Spielzeit</td><td>${mm}:${ss}</td></tr><tr><td>Feinde vernichtet</td><td>${S.stats.kills}</td></tr><tr><td>Eigene Verluste</td><td>${S.stats.lost}</td></tr><tr><td>Gebäude gebaut</td><td>${S.stats.built}</td></tr><tr><td>Öl gefördert</td><td>${S.stats.oil} $</td></tr><tr><td>Gegner – Verluste</td><td>${E.stats.lost}</td></tr></table>
  <div class="row"><button class="sbtn" id="eAgain">🔁 Nochmal</button><button class="sbtn" id="eMenu">🏠 Hauptmenü</button><button class="sbtn" id="eLook">👁 Karte ansehen</button></div>`;
  $('eAgain').onclick=()=>{$('overlay').classList.add('hidden');newGame()};$('eMenu').onclick=()=>{$('overlay').classList.add('hidden');$('start').classList.remove('hidden');paused=true};$('eLook').onclick=()=>{$('overlay').classList.add('hidden');cfg.reveal=true}}
let last=performance.now(),acc=0;
function loop(now){const rdt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused&&sides.length){const dt=rdt*speed;time+=dt;step(dt)}
  if(sides.length){// Kamera
    const sp=600*rdt/zoom;if(keys.ArrowLeft)camX-=sp;if(keys.ArrowRight)camX+=sp;if(keys.ArrowUp)camY-=sp;if(keys.ArrowDown)camY+=sp;
    if(mouseIn&&!drag&&!paused&&matchMedia('(pointer:fine)').matches){const m=14;if(mouse.x<m)camX-=sp;if(mouse.x>CW-m)camX+=sp;if(mouse.y<m)camY-=sp;if(mouse.y>CH-m)camY+=sp}
    clampCam();render();drawMini();if(!paused)updUI()}
  requestAnimationFrame(loop)}
function step(dt){processPaths();
  for(const e of ents){if(e.dead)continue;e.moving=false;if(e.k==='u')updUnit(e,dt);else updBld(e,dt)}
  separate();updProj(dt);updParts(dt);for(const m of marks)m.l-=dt*1.5;marks=marks.filter(m=>m.l>0);
  for(const S of sides)updProd(S,dt);
  if((aiT+=dt)>.8*DIFF[cfg.diff].think){const k=aiT;aiT=0;for(const S of sides)if(!S.human)updAI(S,k)}
  if((visT+=dt)>.2){visT=0;computeVis()}
  if(ents.some(e=>e.dead))ents=ents.filter(e=>!e.dead);
  if(!over){if(!own(0).length)endGame(false,'Alle deine Gebäude wurden zerstört.');else if(!own(1).length)endGame(true,`Die ${FAC[sides[1].fac].name} sind vernichtet. Das Öl gehört dir!`)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&!over&&sides.length&&$('start').classList.contains('hidden'))togglePause()});
window.addEventListener('resize',()=>{if(sides.length)resize()});

/* ======================= Startbildschirm ======================= */
function segSel(id,key,num){document.querySelectorAll(`#${id} .opt`).forEach(b=>b.onclick=()=>{cfg[key]=num?+b.dataset.v:b.dataset.v;document.querySelectorAll(`#${id} .opt`).forEach(x=>x.classList.toggle('on',x===b))})}
segSel('facs','fac');segSel('segD','diff');segSel('segM','size',true);
$('bStart').onclick=()=>{$('start').classList.add('hidden');try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}cfg.reveal=false;newGame()};
$('bHelp').onclick=()=>showHelp();
// Vorschaubilder der Völker
(function(){const pv=[...document.querySelectorAll('#facs canvas')];sides=[{fac:'bunker'},{fac:'mutant'}];
  pv.forEach((c,i)=>{const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,90);g.addColorStop(0,'#5a3a1a');g.addColorStop(1,'#a07a48');x.fillStyle=g;x.fillRect(0,0,240,90);
    const side=i;sides[0].fac=i?'mutant':'bunker';sides[1].fac=i?'mutant':'bunker';
    drawWith(x,()=>{x.save();x.translate(30,22);x.scale(.75,.75);drawBld({type:'hq',side:0,tx:0,ty:0,w:3,h:3,x:48,y:48,hp:1,max:1,anim:1,tdir:0});x.restore();
      const us=[['heavy',150,52,2],['fast',196,30,1.8],['inf',130,26,2.2],['rkt',210,66,2.2]];for(const[t,ux,uy,s]of us){x.save();x.translate(ux,uy);x.scale(s,s);drawUnit({type:t,side:0,x:0,y:0,dir:Math.PI,tdir:Math.PI,anim:i,s:U[t],path:null,load:0});x.restore()}})});
  sides=[]})();
requestAnimationFrame(loop);
</script>

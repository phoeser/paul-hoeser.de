<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a140e">
<title>Ödlandkrieg – Öl. Schrott. Krieg.</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0a07;color:#f0e2c8;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;display:flex}
#view{flex:1;position:relative;min-width:0}
#cv{display:block;width:100%;height:100%;cursor:default}
#side{width:250px;background:linear-gradient(#2a2016,#16110b);border-left:3px solid #5b4428;display:flex;flex-direction:column;padding:8px;gap:6px;overflow-y:auto}
@media(max-width:900px){#side{width:186px;padding:6px}}
.money{display:flex;justify-content:space-between;align-items:center;background:#0e0b07;border:1px solid #5b4428;border-radius:6px;padding:5px 8px;font-weight:900;font-size:18px;color:#ffcf5a;font-family:Consolas,monospace}
.money small{font-size:11px;color:#b9a27e;font-family:inherit;font-weight:700}
#mini{width:100%;aspect-ratio:1;background:#000;border:2px solid #5b4428;border-radius:4px;cursor:crosshair;display:block}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:6px 0;text-align:center;background:#1b150e;border:1px solid #5b4428;border-radius:6px 6px 0 0;font-weight:800;font-size:13px;cursor:pointer;color:#b9a27e}
.tab.on{background:#3b2c1a;color:#ffdf9a}
#btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.bb{position:relative;background:#211910;border:1px solid #5b4428;border-radius:6px;padding:2px 1px 3px;cursor:pointer;text-align:center;color:#f0e2c8;font-family:inherit;min-height:76px;overflow:hidden}
.bb canvas{width:48px;height:40px;display:block;margin:0 auto}
.bb.lock canvas{filter:grayscale(1)}
.pwr{height:12px;background:#0e0b07;border:1px solid #5b4428;border-radius:6px;position:relative;overflow:hidden}.pwr i{position:absolute;left:0;top:0;bottom:0;background:#5ad13a}.pwr span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.bb .nm{font-size:11px;font-weight:800;line-height:1.05;min-height:24px;display:flex;align-items:center;justify-content:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;padding:0 1px}
#side>*{flex-shrink:0}
.bb .co{font-size:11px;color:#ffcf5a;font-weight:800}
.bb.lock{opacity:.38}
.bb.poor .co{color:#ff7a5a}
.bb .prog{position:absolute;left:0;bottom:0;height:5px;background:#ffcf5a}
.bb .shade{position:absolute;inset:0;background:#000a;pointer-events:none}
.bb .cnt{position:absolute;top:2px;right:4px;background:#c0302a;color:#fff;border-radius:9px;padding:0 6px;font-size:12px;font-weight:900}
.bb.ready{border-color:#ffcf5a;box-shadow:0 0 10px #ffcf5a88 inset;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 18px #ffcf5a inset}}
.bb .rd{position:absolute;inset:auto 0 18px 0;font-size:12px;font-weight:900;color:#ffcf5a;text-shadow:0 1px 2px #000}
#info{background:#0e0b07;border:1px solid #5b4428;border-radius:6px;padding:6px;font-size:12px;min-height:64px}
#info b{color:#ffdf9a;font-size:13px}
.hpb{height:6px;background:#3a1a12;border-radius:3px;margin:4px 0;overflow:hidden}.hpb i{display:block;height:100%;background:#7ac943}
.sbtn{width:100%;margin-top:5px;padding:7px;border-radius:6px;border:1px solid #8a6a3c;background:linear-gradient(#5b4428,#3b2c1a);color:#ffe7b0;font-weight:800;font-family:inherit;font-size:13px;cursor:pointer}
.sbtn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:5px}
#topbar{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:5}
.tbtn{background:#1b150ecc;border:1px solid #5b4428;color:#ffdf9a;border-radius:8px;min-width:40px;height:36px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;padding:0 10px}
.tbtn.on{background:#8a6a3c;color:#fff}
#msgs{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6;width:80%}
.msg{background:#120d08e6;border:1px solid #8a6a3c;color:#ffdf9a;padding:5px 14px;border-radius:6px;font-weight:800;font-size:15px;animation:fade 4.5s forwards;text-shadow:0 1px 2px #000}
.msg.bad{border-color:#c0302a;color:#ffb39a}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#overlay{position:fixed;inset:0;z-index:30;background:#000c;display:flex;align-items:center;justify-content:center}
#overlay.hidden{display:none}
.panel{background:linear-gradient(#2a2016,#16110b);border:3px solid #8a6a3c;border-radius:10px;padding:20px 22px;max-width:560px;width:92%;max-height:90vh;overflow:auto;box-shadow:0 0 60px #000}
.panel h2{margin:0 0 10px;font-size:26px;color:#ffcf5a;letter-spacing:1px;text-transform:uppercase}
.panel p,.panel li{font-size:15px;line-height:1.45}
#start{position:fixed;inset:0;z-index:20;overflow:auto;background:#070504}
#titleBg{position:fixed;inset:0;width:100%;height:100%;display:block}
#start .inner{position:relative;z-index:1;max-width:1120px;width:100%;min-height:100%;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:34px;align-items:center}
@media(max-width:900px){#start .inner{grid-template-columns:1fr;gap:16px;padding:14px;max-width:600px}}
.hero{display:flex;flex-direction:column}
.logo{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;font-size:clamp(40px,4.9vw,74px);line-height:.95;letter-spacing:2px;margin:0;white-space:nowrap;transform:skew(-5deg);filter:drop-shadow(0 4px 0 #2a0e04) drop-shadow(0 0 26px #ff7a2a88)}
.logo span{background:linear-gradient(#fff3c4 8%,#ffc04a 46%,#a8480e 54%,#ffb84a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #3a1404}
.logo span+span{background-image:linear-gradient(#ffd0b0 8%,#ff5a2a 46%,#7a1206 54%,#ff7a3a 92%)}
.slogan{display:flex;align-items:center;gap:12px;color:#ffe0a8;font-weight:800;letter-spacing:7px;font-size:14px;margin:12px 0 4px;text-shadow:0 2px 4px #000}
.slogan:before,.slogan:after{content:"";height:3px;flex:1;background:repeating-linear-gradient(-45deg,#ffcf5a 0 8px,#1a120a 8px 16px);opacity:.85;max-width:90px}
.lead{color:#f0dcc0;font-size:16px;line-height:1.45;max-width:440px;margin:8px 0 6px;text-shadow:0 2px 6px #000}
.setup{background:linear-gradient(#1c140dee,#0e0a06f2);border:2px solid #8a6a3c;border-radius:6px;padding:16px 18px 18px;box-shadow:0 12px 50px #000c,inset 0 0 0 1px #ffffff12;position:relative;backdrop-filter:blur(3px)}
.setup:before,.setup:after{content:"";position:absolute;top:8px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8c88a,#5a3e1c)}
.setup:before{left:8px}.setup:after{right:8px}
.setup h3{margin:0 0 2px;text-align:center;font-size:17px;letter-spacing:4px;color:#ffcf5a;text-transform:uppercase}
.lbl{font-weight:900;color:#ffcf5a;margin:13px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.opt{flex:1;min-width:96px;background:linear-gradient(#2a2015,#1a130c);border:2px solid #5b4428;border-radius:5px;padding:9px 6px;transition:border-color .15s,transform .1s;color:#f0e2c8;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.opt:hover{border-color:#b08a4c}.opt:active{transform:translateY(1px)}
.opt.on{border-color:#ffcf5a;background:linear-gradient(#5a3e1c,#33230f);color:#fff;box-shadow:0 0 14px #ffcf5a66,inset 0 1px 0 #ffffff30}
.opt small{display:block;font-weight:600;color:#b9a27e;font-size:12px;margin-top:3px}
.big{width:100%;margin-top:14px;padding:15px 14px;font-size:22px;font-weight:900;border:0;background:linear-gradient(#ffb040,#d0601a 45%,#8a2e0a);color:#fff;cursor:pointer;font-family:inherit;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 0 #3a1404;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:inset 0 2px 0 #ffe0a080,inset 0 -3px 0 #0006;filter:drop-shadow(0 4px 10px #000a);transition:filter .15s,transform .1s}
.big:hover{filter:drop-shadow(0 4px 14px #ff7a2a99) brightness(1.12)}.big:active{transform:translateY(2px)}
.big.sec{background:linear-gradient(#4e3a22ee,#2a1e12ee);font-size:16px;letter-spacing:1px;margin-top:8px;padding:11px 14px;color:#ffe7b0;box-shadow:inset 0 0 0 1px #8a6a3c,inset 0 2px 0 #ffffff1c;text-align:left}
.big:disabled{opacity:.5;cursor:default;filter:none}
.facs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fac canvas{width:100%;height:90px;display:block;border-radius:3px;margin-bottom:5px;border:1px solid #0008}
.hidden{display:none!important}
kbd{background:#3b2c1a;border:1px solid #8a6a3c;border-radius:4px;padding:0 5px;font-family:inherit;font-size:13px}
table.st{width:100%;border-collapse:collapse;margin:8px 0}table.st td{padding:4px;border-bottom:1px solid #ffffff18}table.st td:last-child{text-align:right;font-weight:800;color:#ffcf5a}
</style>
</head>
<body>
<div id="game">
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="topbar"><button class="tbtn" id="tMenu">☰</button><button class="tbtn" id="tAtk" title="Angriffsbewegung (A)">⚔️</button><button class="tbtn" id="tStop" title="Stopp (S)">✋</button><button class="tbtn" id="tBox" title="Rahmen ziehen (Tablet)">⬚</button><button class="tbtn" id="tHome" title="Zur Basis (H)">🏠</button></div>
    <div id="msgs"></div>
  </div>
  <div id="side">
    <div class="money"><span id="money">0</span><small>ÖL-DOLLAR</small></div>
    <div class="pwr" id="pwr"><i></i><span>Strom</span></div>
    <canvas id="mini" width="200" height="200"></canvas>
    <div class="tabs"><div class="tab on" data-t="b">Bauen</div><div class="tab" data-t="u">Truppen</div></div>
    <div id="btns"></div>
    <div id="info"></div>
  </div>
</div>
<div id="overlay" class="hidden"><div class="panel" id="panel"></div></div>

<div id="start"><canvas id="titleBg"></canvas><div class="inner">
  <div class="hero">
    <h1 class="logo"><span>ÖDLAND</span><span>KRIEG</span></h1>
    <div class="slogan">ÖL · SCHROTT · KRIEG</div>
    <p class="lead">Die Welt ist verbrannt, das letzte Öl gehört dem Stärksten. Bau deine Basis, sichere die Ölfelder und fege deine Gegner aus dem Ödland.</p>
    <button class="big" id="bStart">⚔ Gefecht starten</button>
    <button class="big sec" id="bOnline">🌐 Mit anderen spielen (bis zu 4)</button>
    <button class="big sec" id="bCamp" disabled>🎖 Kampagne – kommt in der nächsten Ausbaustufe</button>
    <button class="big sec" id="bHelp">📜 So wird gespielt</button>
  </div>
  <div class="setup">
    <h3>Gefecht einrichten</h3>
    <div class="lbl">Wähle dein Volk</div>
    <div class="facs" id="facs">
      <button class="opt fac on" data-v="bunker"><canvas width="240" height="90"></canvas>Bunkerleute<small>Stahl, Ketten und Kanonen – die Überlebenden aus den Atombunkern</small></button>
      <button class="opt fac" data-v="mutant"><canvas width="240" height="90"></canvas>Mutanten<small>Schrott, Wut und Kampfbestien – die Kinder der Strahlung</small></button>
    </div>
    <div class="lbl">Stärke der Gegner</div>
    <div class="seg" id="segD"><button class="opt" data-v="easy">Leicht<small>zum Reinkommen</small></button><button class="opt on" data-v="normal">Normal<small>fairer Kampf</small></button><button class="opt" data-v="hard">Schwer<small>greift früh an</small></button><button class="opt" data-v="brutal">Brutal<small>mehr Öl, mehr Wut</small></button></div>
    <div class="lbl">Anzahl Gegner</div>
    <div class="seg" id="segP"><button class="opt on" data-v="2">1 Gegner</button><button class="opt" data-v="3">2 Gegner<small>jeder gegen jeden</small></button><button class="opt" data-v="4">3 Gegner<small>jeder gegen jeden</small></button></div>
    <div class="lbl">Karte</div>
    <div class="seg" id="segM"><button class="opt" data-v="48">Klein</button><button class="opt on" data-v="64">Mittel</button><button class="opt" data-v="84">Groß</button></div>
  </div>
</div></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/terrain.js"></script>
<script src="js/sprites.js"></script>
<script src="js/units.js"></script>
<script src="js/ui.js"></script>
<script src="js/title.js"></script>
<script src="js/net.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#145035">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Böhmisch Watten</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff8e7;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 40%,#2f8a5b,#17583a 65%,#0c3524)}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:rgba(0,0,0,.28);border-bottom:2px solid #d8b24a}
header h1{font-size:17px;margin:0;flex:1;font-weight:900;letter-spacing:.5px;color:#ffe08a}
.hbtn{background:rgba(0,0,0,.3);border:1px solid #d8b24a;color:#fff8e7;border-radius:10px;min-width:42px;height:38px;font-size:18px;cursor:pointer}
#scores{display:flex;gap:6px;padding:6px 8px;flex-wrap:wrap;justify-content:center}
.sc{background:rgba(0,0,0,.3);border:2px solid transparent;border-radius:12px;padding:3px 10px;min-width:74px;text-align:center}
.sc.turn{border-color:#ffd65a;box-shadow:0 0 10px rgba(255,214,90,.6)}
.sc.fold{opacity:.5}
.sc .nm{font-size:12px;font-weight:700;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.sc .pt{font-size:22px;font-weight:900;line-height:1.1}
.sc .tr{font-size:11px;min-height:14px;color:#ffe08a}
#table{position:relative;flex:1;min-height:0}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-50%);font-size:12px;font-weight:800;text-align:center;pointer-events:none}
.seat .bub{background:rgba(0,0,0,.45);border-radius:8px;padding:2px 8px;font-weight:700;font-size:11px;white-space:nowrap}
.backs{display:flex}
.back{width:24px;height:37px;border-radius:4px;background:radial-gradient(circle,#fff3 1px,transparent 1.5px) 0 0/5px 5px,repeating-linear-gradient(45deg,#1f4f8a 0 3px,#2d68ad 3px 6px);border:2px solid #fff6;margin-left:-12px;box-shadow:0 1px 3px #0008}
.back:first-child{margin-left:0}
#trumpbox{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.35);border:1px solid #d8b24a88;border-radius:12px;padding:6px 8px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;z-index:2}
#trumpbox .ti{width:30px;height:30px}
#trumpbox b{font-size:15px;color:#ffe08a;display:block}
.tcard{position:absolute;transform:translate(-50%,-50%);transition:left .3s,top .3s}
.tcard.win .card{box-shadow:0 0 0 3px #ffd65a,0 0 18px #ffd65a}
#msg{text-align:center;min-height:24px;font-weight:800;padding:3px 10px;font-size:14px;color:#fff3c4;text-shadow:0 1px 2px #000}
#hand{display:flex;justify-content:center;align-items:flex-end;padding:10px 8px 2px;min-height:calc(var(--cw)*1.55 + 26px);--cw:min(70px,calc((100vw - 40px)/5.4))}
#hand .card{margin:0 2px}
.card{--cw:inherit;width:var(--cw);height:calc(var(--cw)*1.55);background:linear-gradient(#fffdf6,#f1e8d0);border-radius:7%/4.5%;color:#222;position:relative;box-shadow:0 2px 5px #0008;border:1px solid #0004;flex:none;cursor:pointer;transition:transform .15s,filter .15s}
.small{--cw:52px}
.card .cr{position:absolute;top:3px;left:5px;font-weight:900;font-size:calc(var(--cw)*.27);line-height:1}
.card .ci{position:absolute;top:calc(var(--cw)*.33);left:3px;width:calc(var(--cw)*.24);height:calc(var(--cw)*.24)}
.card .big{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:calc(var(--cw)*.62);height:calc(var(--cw)*.62)}
.card .fig{position:absolute;right:4px;top:3px;font-size:calc(var(--cw)*.22)}
.card .cl{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:calc(var(--cw)*.16);font-weight:900;color:#555;letter-spacing:.3px}
.card.crit{background:linear-gradient(#fffaf0,#f6e6b0);box-shadow:0 0 0 2px #e0a800,0 2px 6px #000a}
.card.crit .cl{color:#a86b00}
.card.dim{filter:brightness(.5) saturate(.6)}
.card.legal{transform:translateY(-8px)}
.card.mark{transform:translateY(-18px);box-shadow:0 0 0 3px #4fc3ff,0 6px 10px #000a}
.card svg{display:block;width:100%;height:100%}
#bar{display:flex;gap:6px;padding:6px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-wrap:wrap;background:rgba(0,0,0,.25);border-top:2px solid #d8b24a;min-height:58px;align-items:center}
.btn{flex:1 1 auto;min-height:46px;border:0;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:800;background:#2c4a3a;color:#fff8e7;cursor:pointer}
.btn.gold{background:linear-gradient(#f0cc66,#b8892c);color:#241a05}
.btn.red{background:linear-gradient(#e8665a,#a3291f);color:#fff}
.btn.green{background:linear-gradient(#5bd27a,#22833d);color:#04220c}
.btn.on{outline:3px solid #4fc3ff}
.btn:disabled{opacity:.38;cursor:default}
#ticker{position:absolute;right:8px;top:8px;left:40%;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:3}
.tick{background:rgba(10,20,15,.85);border-right:4px solid #d8b24a;padding:4px 8px;border-radius:6px;font-size:12.5px;width:fit-content;max-width:100%;animation:fade 6s forwards}
.tick.bad{border-color:#e0574a}.tick.good{border-color:#5bd27a}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
#sheet.hidden{display:none}
.cardx{background:#163d2b;border:2px solid #d8b24a;border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:700px){#sheet{align-items:center}.cardx{border-radius:18px;border-bottom:2px solid #d8b24a}}
h2{margin:0 0 8px;font-size:20px;color:#ffe08a}
p{margin:6px 0;line-height:1.4;font-size:14px}
ul{padding-left:18px;margin:6px 0}li{margin:4px 0;font-size:14px;line-height:1.35}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
table.res{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
table.res td,table.res th{padding:6px 4px;border-bottom:1px solid #ffffff22;text-align:center}
table.res td:first-child,table.res th:first-child{text-align:left}
.plus{color:#ff8a7a;font-weight:800}.minus{color:#7dffa0;font-weight:800}
#start{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 25%,#2f8a5b,#0c3524 70%);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 16px}
#start .inner{max-width:480px;width:100%;margin:auto}
.title{font-size:36px;font-weight:900;text-align:center;color:#ffe08a;text-shadow:0 3px 0 #6b4a10;margin:6px 0 0}
.sub{text-align:center;color:#d8efe2;margin:2px 0 14px;font-size:15px}
.lbl{font-weight:800;margin:14px 0 6px;color:#ffe08a;font-size:14px}
.seg{display:flex;gap:6px}.seg .btn{min-height:42px}
.seg .btn.on{background:linear-gradient(#f0cc66,#b8892c);color:#241a05;outline:none}
.hidden{display:none!important}
.sm{font-size:12px;opacity:.85}
input.txt{width:100%;padding:12px;border-radius:10px;border:1px solid #d8b24a;background:#0e2c1f;color:#fff;font-size:18px;font-weight:700;margin:4px 0}
.code{font-size:34px;font-weight:900;letter-spacing:6px;color:#ffe08a;text-align:center;margin:6px 0}
.item{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;background:#1d4a35;margin:6px 0}
.fan{display:flex;justify-content:center;gap:6px;margin:10px 0}
.fan .card{--cw:58px}
</style>
</head>
<body>
<div id="app">
  <header><h1>🂡 Böhmisch Watten</h1><button class="hbtn" id="bMenu">☰</button></header>
  <div id="scores"></div>
  <div id="table"><div id="trumpbox" class="hidden"></div><div id="ticker"></div></div>
  <div id="msg"></div>
  <div id="hand"></div>
  <div id="bar"></div>
</div>
<div id="sheet" class="hidden"><div class="cardx" id="card"></div></div>

<div id="start"><div class="inner">
  <div class="fan" id="startFan"></div>
  <h1 class="title">BÖHMISCH WATTEN</h1>
  <div class="sub">Das bayerische Kartenspiel – 20 runter!</div>
  <div class="lbl">Wie viele Spieler am Tisch?</div>
  <div class="seg" id="segN"><button class="btn" data-v="2">2</button><button class="btn on" data-v="3">3</button><button class="btn" data-v="4">4</button></div>
  <div class="lbl">Computer-Tempo</div>
  <div class="seg" id="segSp"><button class="btn" data-v="1">Gemütlich</button><button class="btn on" data-v="2">Normal</button><button class="btn" data-v="3">Flott</button></div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:18px">
    <button class="btn gold" id="bNew" style="font-size:18px;min-height:54px">🤖 Gegen den Computer spielen</button>
    <button class="btn green hidden" id="bCont">▶️ Weiterspielen</button>
    <button class="btn" id="bOnline" style="background:linear-gradient(#3b7fd6,#24508f)">🌐 Online mit Freunden (live)</button>
    <button class="btn" id="bHelp">📜 Spielregeln</button>
  </div>
  <p class="sm" style="text-align:center;margin-top:14px">Jeder startet mit 20 Punkten. Jeder Stich zieht einen ab – wer zuerst unter null kommt, gewinnt!</p>
</div></div>

<script>
"use strict";
/* ================= Karten ================= */
const SU=['E','G','H','S'],SN={E:'Eichel',G:'Gras',H:'Herz',S:'Schellen'};
const RK=['A','K','O','U','10','9','8','7'];
const RN={A:'Sau',K:'König',O:'Ober',U:'Unter','10':'Zehner','9':'Neuner','8':'Achter','7':'Siebener'};
const CRIT={HK:'Maxi',S7:'Belli',E7:'Spitz'},CRITORD=['HK','S7','E7'];
const cs=c=>c[0],cr=c=>c.slice(1),isCrit=c=>c in CRIT;
const ICONP={
 H:'<path d="M20 35C5 24 2 16 6 10c4-6 12-5 14 1 2-6 10-7 14-1 4 6 1 14-14 25z" fill="#d6262b" stroke="#7a0d10" stroke-width="1.5"/><path d="M11 12c2-3 5-3 6-1" stroke="#fff8" stroke-width="2" fill="none" stroke-linecap="round"/>',
 S:'<circle cx="20" cy="7" r="2.6" fill="#8a5a00"/><circle cx="20" cy="22" r="13" fill="#f2b51d" stroke="#8a5a00" stroke-width="1.5"/><rect x="7.5" y="17" width="25" height="5" fill="#c9302c"/><circle cx="20" cy="29" r="2.6" fill="#5a3a00"/><path d="M13 13c2-2 4-3 6-3" stroke="#fff9" stroke-width="2" fill="none" stroke-linecap="round"/>',
 E:'<path d="M20 10l1-6" stroke="#4a2a08" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="20" cy="25" rx="9" ry="11" fill="#c98a3a" stroke="#6b3f10" stroke-width="1.5"/><path d="M9 18Q20 6 31 18Q20 23 9 18z" fill="#7a4a1c" stroke="#4a2a08" stroke-width="1.5"/><path d="M15 26c0-4 1-6 3-7" stroke="#fff6" stroke-width="2" fill="none" stroke-linecap="round"/>',
 G:'<path d="M20 37C6 28 6 12 20 3c14 9 14 25 0 34z" fill="#3a9a3a" stroke="#1d5a1d" stroke-width="1.5"/><path d="M20 37V8M20 16l-7-5M20 23l-8-5M20 16l7-5M20 23l8-5" stroke="#1d5a1d" stroke-width="1.3" fill="none"/>'};
const ICON=Object.fromEntries(Object.entries(ICONP).map(([k,v])=>[k,`<svg viewBox="0 0 40 40">${v}</svg>`]));
const pip=(s,x,y,z,rot)=>`<g transform="translate(${x} ${y})${rot?' rotate(180)':''} translate(${-z/2} ${-z/2}) scale(${z/40})">${ICONP[s]}</g>`;
const COAT={H:'#b8322a',G:'#2f7d32',S:'#d29a12',E:'#6b4420'},COAT2={H:'#7d1c16',G:'#1b4d1e',S:'#8a6206',E:'#3e260f'};
const PIPS={'7':[[30,34],[70,34],[50,58],[30,82],[70,82],[30,120],[70,120]],'8':[[30,32],[70,32],[30,61],[70,61],[30,90],[70,90],[30,120],[70,120]],
 '9':[[30,32],[70,32],[30,61],[70,61],[50,77],[30,93],[70,93],[30,122],[70,122]],'10':[[30,30],[70,30],[50,46],[30,62],[70,62],[30,93],[70,93],[50,109],[30,125],[70,125]]};
function figure(s,r){const c=COAT[s],d=COAT2[s];
  const hat=r==='K'?`<path d="M38 40l4-12 5 8 3-11 3 11 5-8 4 12z" fill="#f2c230" stroke="#8a6206" stroke-width="1.2"/><circle cx="50" cy="25" r="2" fill="#d6262b"/>`
   :r==='O'?`<path d="M34 44q16-16 32 0z" fill="#2d2d2d"/><path d="M62 38q10-14 4-24q-2 10-8 18z" fill="#fff" stroke="#999" stroke-width=".8"/>`
   :`<path d="M37 44q13-12 26 0l-2 3h-22z" fill="${d}"/><circle cx="50" cy="35" r="2.5" fill="#f2c230"/>`;
  const beard=r==='U'?'':`<path d="M42 58q8 9 16 0q-2 7-8 8q-6-1-8-8z" fill="${r==='K'?'#e8e2d4':'#6b4a2a'}"/>`;
  const prop=r==='K'?`<path d="M74 66v52" stroke="#8a6206" stroke-width="3"/><circle cx="74" cy="63" r="5" fill="#f2c230" stroke="#8a6206"/>`
   :r==='O'?`<path d="M26 120l10-56" stroke="#999" stroke-width="3"/><path d="M22 70h14" stroke="#8a6206" stroke-width="3"/>`
   :`<path d="M72 120l-6-50" stroke="#7a4a1c" stroke-width="3"/>`;
  const sp=r==='O'?pip(s,26,36,20):r==='U'?pip(s,74,112,20):'';
  return`${prop}<path d="M30 132q0-50 20-62q20 12 20 62z" fill="${c}" stroke="${d}" stroke-width="1.5"/>
   <path d="M50 70v62" stroke="${d}" stroke-width="1.2"/><circle cx="46" cy="90" r="1.6" fill="#f2c230"/><circle cx="46" cy="102" r="1.6" fill="#f2c230"/><circle cx="46" cy="114" r="1.6" fill="#f2c230"/>
   <path d="M38 70q12 8 24 0l-4 6q-8 4-16 0z" fill="#fff" stroke="#bbb" stroke-width=".6"/>
   <circle cx="50" cy="52" r="11" fill="#f4cfa6" stroke="#b07a4a" stroke-width="1"/><circle cx="46" cy="51" r="1.2" fill="#333"/><circle cx="54" cy="51" r="1.2" fill="#333"/><path d="M47 56q3 2 6 0" stroke="#a0522d" stroke-width="1" fill="none"/>
   ${beard}${hat}${sp}`}
function sau(s){return`${pip(s,50,70,60)}<path d="M18 112h64l-6 8 6 8h-64l6-8z" fill="#fff6dc" stroke="#8a6206" stroke-width="1.2"/>
  <text x="50" y="123.5" text-anchor="middle" font-size="10" textLength="54" lengthAdjust="spacingAndGlyphs" font-weight="900" fill="#6b3f10" font-family="Georgia,serif">${s==='H'?'HERZ':s==='S'?'SCHELLN':s==='G'?'GRAS':'EICHEL'}-SAU</text>
  <g transform="translate(76 26)"><ellipse cx="0" cy="0" rx="10" ry="8" fill="#f4a7b0" stroke="#b5606c"/><ellipse cx="0" cy="2" rx="4.5" ry="3.2" fill="#e88594"/><circle cx="-1.6" cy="2" r=".9" fill="#7a2a36"/><circle cx="1.6" cy="2" r=".9" fill="#7a2a36"/><circle cx="-4" cy="-3" r="1" fill="#333"/><circle cx="4" cy="-3" r="1" fill="#333"/><path d="M-8-6l-3-5 6 2zM8-6l3-5-6 2z" fill="#f4a7b0" stroke="#b5606c" stroke-width=".6"/></g>`}
function cardSVG(c){const s=cs(c),r=cr(c),crit=isCrit(c),col=s==='H'?'#c41e24':s==='S'?'#9a6a00':s==='G'?'#2b7a2b':'#6b3f10';
  const idx=r==='A'?'A':r;
  let body=r==='A'?sau(s):FIGR.includes(r)?figure(s,r):PIPS[r].map(([x,y],i)=>pip(s,x,y,r==='10'?19:22,y>80)).join('');
  if(r==='10')body+=`<path d="M38 73h24v9h-24z" fill="#fff6dc" stroke="#8a6206" stroke-width=".8"/><text x="50" y="80.5" text-anchor="middle" font-size="8" font-weight="900" fill="#8a6206" font-family="Georgia,serif">X</text>`;
  const corner=(t)=>`<g ${t}><text x="9" y="15" text-anchor="middle" font-size="13" font-weight="900" fill="${col}" font-family="Georgia,serif">${idx}</text>${pip(s,9,23,9)}</g>`;
  return`<svg viewBox="0 0 100 155"><rect x="2.5" y="2.5" width="95" height="150" rx="7" fill="none" stroke="${crit?'#c48a00':'#9b8a6a'}" stroke-width="1.2"/>
   <rect x="17" y="8" width="66" height="139" rx="3" fill="none" stroke="${crit?'#e3b23c':'#d6c9aa'}" stroke-width=".8"/>
   ${corner('')}${corner('transform="rotate(180 50 77.5)"')}${body}
   ${crit?`<g><rect x="22" y="138" width="56" height="13" rx="6" fill="#c41e24" stroke="#f2c230" stroke-width="1.2"/><text x="50" y="148" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff" font-family="Georgia,serif" letter-spacing="1">${CRIT[c].toUpperCase()}</text></g>`:''}</svg>`}
const FIGR=['K','O','U'];
function cardHTML(c,cls=''){if(c===0||c==null)return`<div class="back ${cls}"></div>`;
  return`<div class="card ${isCrit(c)?'crit':''} ${cls}" data-c="${c}" title="${cname(c)}">${cardSVG(c)}</div>`}
const cname=c=>isCrit(c)?`${CRIT[c]} (${SN[cs(c)]}-${RN[cr(c)]})`:`${SN[cs(c)]}-${RN[cr(c)]}`;
const fullDeck=()=>SU.flatMap(s=>RK.map(r=>s+r));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=()=>Math.random(),ri=n=>Math.floor(Math.random()*n),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));

/* ================= Regeln ================= */
let G=null,ME=0,speed=2,busyAI=false,overShown=false,handEndShown=-1;
const isTrump=c=>isCrit(c)||cs(c)===G.trump;
function power(c,led){if(isCrit(c))return 1000-CRITORD.indexOf(c);const rv=7-RK.indexOf(cr(c));
  if(cs(c)===G.trump)return 500+rv;if(led&&!isTrump(led)&&cs(c)===cs(led))return 100+rv;return 0}
function val(c){if(isCrit(c))return 100-CRITORD.indexOf(c);const rv=7-RK.indexOf(cr(c));return cs(c)===G.trump?50+rv:rv}
function trickBest(tr){let b=null,bp=-1;const led=tr[0].c;for(const t of tr){const p=power(t.c,led);if(p>bp){bp=p;b=t}}return b}
function legal(hand,tr){if(!tr.length)return hand.slice();
  const led=tr[0].c,best=trickBest(tr),bp=power(best.c,led),beats=c=>power(c,led)>bp;
  if(isTrump(led)){const t=hand.filter(isTrump);if(t.length){const h=t.filter(beats);return h.length?h:t}return hand.slice()}
  const f=hand.filter(c=>!isCrit(c)&&cs(c)===cs(led));
  if(f.length){if(isTrump(best.c))return f;const h=f.filter(beats);return h.length?h:f}
  const t=hand.filter(isTrump);if(t.length){const h=t.filter(beats);return h.length?h:t}
  return hand.slice();}
const nm0=i=>G.players[i].nick||G.players[i].name;
const V=(p,du,er)=>nm0(p)==='Du'?du:er;
const nameFor=(i,v)=>i===v?'Du':nm0(i);
const pname=i=>nameFor(i,ME);
const seatsFrom=s=>[...Array(G.n)].map((_,i)=>(s+i)%G.n);
const COMP=['Sepp','Resi','Done','Vroni'];

function newGame(n,guests){guests=guests||[];overShown=false;handEndShown=-1;
  const names=shuffle(COMP.slice());
  G={n,online:NET.mode==='host',handNo:0,dealer:ri(n),over:false,winners:[],phase:'',cur:-1,
    players:[...Array(n)].map((_,i)=>{const h=i<=guests.length;return{name:h?(i===0?(NET.mode==='host'?NET.nick:'Du'):guests[i-1]):names[i]+' 🤖',nick:h?(i===0?(NET.mode==='host'?NET.nick:''):guests[i-1]):'',human:h,wasHuman:h,score:20,status:null,tricks:0,prevFold:false}}),
    hands:[],deck:[],stock:[],disc:[],trick:[],last:null,results:null};
  startHand();}
function startHand(){const n=G.n;G.handNo++;G.deck=shuffle(fullDeck());G.hands=[...Array(n)].map(()=>[]);G.trick=[];G.last=null;G.disc=[];G.stock=[];G.up=null;G.upTaken=false;G.trump=null;G.results=null;G.played=[];

  G.cutter=(G.dealer-1+n)%n;G.cut={step:0,card:null,who:-1,log:[]};G.phase='cut';
  tickAll(`🃏 Runde ${G.handNo}: ${nm0(G.dealer)} gibt, ${nm0(G.cutter)} hebt ab.`);
  cutReveal();}
function cutReveal(){const c=G.deck[0];G.cut.card=c;const who=[G.cutter,G.dealer,G.cutter][G.cut.step];
  if(isCrit(c)){G.cut.who=who;G.cur=who;G.phase='cut';tickAll(`✨ Beim Abheben liegt ${cname(c)} unten!`,'good')}
  else{if(G.cut.step===0)G.cut.log.push(c);endCut()}}
function endCut(){G.cut.who=-1;deal()}
function deal(){const ord=seatsFrom(G.dealer+1);
  for(const p of ord)while(G.hands[p].length<3)G.hands[p].push(G.deck.shift());
  G.up=G.deck.shift();G.trump=cs(G.up);
  for(const p of ord)while(G.hands[p].length<5)G.hands[p].push(G.deck.shift());
  G.stock=G.deck;G.deck=[];G.mult=G.trump==='H'?2:1;
  tickAll(`Trumpf ist ${SN[G.trump]}${G.mult>1?' – Herz zählt doppelt!':''}`);
  G.phase='decide';G.decOrder=ord;G.decIdx=0;nextDecide();}
function canFold(p){const P=G.players[p];if(G.handNo<=1||G.trump==='H'||P.score<=5||P.prevFold||p===G.dealer)return false;
  const inGame=G.players.filter(Q=>Q.status!=='fold').length;return inGame-1>=2;}
function nextDecide(){while(G.decIdx<G.n){const p=G.decOrder[G.decIdx];if(!canFold(p)){G.players[p].status='play';G.decIdx++;continue}G.cur=p;return}
  G.phase='exchange';G.exOrder=G.decOrder.filter(p=>G.players[p].status==='play');G.exIdx=0;nextExchange();}
function nextExchange(){if(G.exIdx<G.exOrder.length){G.cur=G.exOrder[G.exIdx];return}
  G.phase='play';G.order=seatsFrom(G.dealer+1).filter(p=>G.players[p].status==='play');G.cur=G.order[0];G.trick=[];}
const nextInOrder=p=>G.order[(G.order.indexOf(p)+1)%G.order.length];
function finishTrick(){if(!G||G.phase!=='trickShow')return;const w=G.last.w;G.trick=[];
  if(G.hands[w].length===0){endHand()}else{G.phase='play';G.cur=w}
  save();sync();render();runAI();}
function endHand(){const res=[];
  G.players.forEach((P,i)=>{let d=0;if(P.status==='play'){d=P.tricks>0?-P.tricks*G.mult:5*G.mult;P.score+=d}res.push({p:i,status:P.status,tricks:P.tricks,d,score:P.score});P.prevFold=P.status==='fold'});

  if(low.length){const m=Math.min(...G.players.map(P=>P.score));G.winners=G.players.map((P,i)=>P.score===m?i:-1).filter(i=>i>=0);G.over=true}}
/* Alle Spielzüge laufen hier durch – offline direkt, online beim Gastgeber */
function applyAction(p,a){if(!G||G.over&&a.t!=='restart')return{err:1};
  if(a.t==='next'){if(p!==0||G.phase!=='handEnd'||G.over)return{err:1};G.dealer=(G.dealer+1)%G.n;startHand();return{ok:1}}
  if(G.cur!==p)return{err:'Nicht dein Zug'};const h=G.hands[p];
  switch(a.t){
  case 'cut':{if(G.phase!=='cut')return{err:1};if(a.take){const c=G.deck.shift();h.push(c);G.cut.log.push(c);tickAll(`${nm0(p)} ${V(p,'nimmst','nimmt')} ${cname(c)}!`,'good');G.cut.step++;if(G.cut.step<3)cutReveal();else endCut()}
    else{tickAll(`${nm0(p)} ${V(p,'lässt','lässt')} den Kritischen liegen.`);endCut()}return{ok:1}}
  case 'decide':{if(G.phase!=='decide')return{err:1};const play=a.play||!canFold(p);G.players[p].status=play?'play':'fold';
    tickAll(play?`${nm0(p)} ${V(p,'gehst','geht')} mit.`:`${nm0(p)} ${V(p,'setzt','setzt')} aus.`);G.decIdx++;nextDecide();return{ok:1}}
  case 'exchange':{if(G.phase!=='exchange')return{err:1};const cards=(a.cards||[]).filter((c,i,arr)=>h.includes(c)&&arr.indexOf(c)===i);
    const isD=p===G.dealer,up=!!a.up&&isD&&G.up&&!G.upTaken&&cards.length>=1,nStock=cards.length-(up?1:0);
    if(nStock<0||nStock>Math.min(G.stock.length,isD?2:3))return{err:'Zu viele Karten'};
    cards.forEach((c,k)=>{h.splice(h.indexOf(c),1);G.disc.push(c);if(k===0&&up){h.push(G.up);G.upTaken=true}else h.push(G.stock.shift())});
    G.players[p].ex=cards.length;tickAll(`${nm0(p)} ${V(p,'tauschst','tauscht')} ${cards.length===0?'keine Karte':cards.length===1?'1 Karte':cards.length+' Karten'}${up?' (mit Trumpfkarte)':''}.`);
    G.exIdx++;nextExchange();return{ok:1}}
  case 'play':{if(G.phase!=='play'||!h.includes(a.c)||!legal(h,G.trick).includes(a.c))return{err:'Diese Karte darfst du nicht spielen'};
    h.splice(h.indexOf(a.c),1);G.trick.push({p,c:a.c});(G.played=G.played||[]).push(a.c);sfx('card');
    if(G.trick.length===G.order.length){const w=trickBest(G.trick).p;G.players[w].tricks++;G.last={tr:G.trick.slice(),w};G.phase='trickShow';G.cur=-1;
      setTimeout(finishTrick,[0,1900,1400,900][speed]);}
    else G.cur=nextInOrder(p);return{ok:1}}
  }
  return{err:1};}
function act(a){if(NET.mode==='guest')return new Promise(res=>{const rid=++NET.rid;NET.wait[rid]=res;NET.hostConn.send({type:'act',a,rid});setTimeout(()=>{if(NET.wait[rid]){delete NET.wait[rid];res({err:'timeout'})}},15000)});
  const r=applyAction(ME,a);save();sync();render();runAI();return Promise.resolve(r)}

/* ================= Computer ================= */
/* Der Computer merkt sich alle gespielten Karten und rechnet aus, welche Karten noch "draußen" sind */
function unknownFor(p){const known=new Set([...G.hands[p],...(G.played||[])]);if(G.up&&!G.upTaken)known.add(G.up);return fullDeck().filter(c=>!known.has(c))}
function isBoss(c,led,unk){const pc=power(c,led||c);return !unk.some(x=>power(x,led||c)>pc)}
function expTricks(h){const unk=unknownFor(G.cur),nOpp=G.players.filter((P,i)=>i!==G.cur&&P.status!=='fold').length;let e=0;
  for(const c of h){if(isBoss(c,c,unk)){e+=1;continue}
    const better=unk.filter(x=>power(x,c)>power(c,c)).length;
    if(isTrump(c))e+=Math.max(0,.85-better*.09);else if(cr(c)==='A')e+=Math.max(0,.5-nOpp*.08);else if(cr(c)==='K')e+=.1}
  return e*(nOpp<=1?1.25:nOpp===2?1:.85)}
function aiAct(p){const h=G.hands[p],P=G.players[p];
  if(G.phase==='cut')return applyAction(p,{t:'cut',take:true});
  if(G.phase==='decide'){const e=expTricks(h),risk=P.score>=15?.15:0;return applyAction(p,{t:'decide',play:e>=.5+risk})}
  if(G.phase==='exchange'){const isD=p===G.dealer;
    const keep=c=>isTrump(c)||cr(c)==='A';
    const sorted=h.slice().sort((a,b)=>val(a)-val(b));
    let up=isD&&G.up&&!G.upTaken&&val(G.up)>val(sorted[0]);let disc=sorted.filter(c=>!keep(c));if(up&&!disc.length)disc=[sorted[0]];
    disc=disc.slice(0,Math.min(G.stock.length,isD?2:3)+(up?1:0));if(!disc.length)up=false;
    return applyAction(p,{t:'exchange',cards:disc,up})}
  if(G.phase==='play'){const L=legal(h,G.trick),unk=unknownFor(p),byVal=(a,b)=>val(a)-val(b);let c;
    if(!G.trick.length){
      const boss=L.filter(x=>isBoss(x,x,unk)).sort(byVal);
      const trumps=L.filter(isTrump).sort(byVal),offA=L.filter(x=>!isTrump(x)&&cr(x)==='A'),off=L.filter(x=>!isTrump(x)).sort(byVal);
      if(boss.length)c=boss[0]; // sicherer Stich zuerst
      else if(offA.length)c=offA[0]; // dann eine Sau probieren
      else if(G.order.length===2)c=trumps.length?trumps[trumps.length-1]:off[0]; // zu zweit: Druck mit Trumpf
      else c=off.length?off[0]:trumps[0]} // sonst Trümpfe aufheben
    else{const led=G.trick[0].c,bp=power(trickBest(G.trick).c,led),win=L.filter(x=>power(x,led)>bp).sort((a,b)=>power(a,led)-power(b,led));
      const last=G.trick.length===G.order.length-1;
      if(!win.length){const dump=L.slice().sort(byVal);c=dump.find(x=>!isTrump(x))||dump[0]}
      else if(last)c=win[0]; // als Letzter: billigster Stich
      else{const safe=win.filter(x=>isBoss(x,led,unk));c=safe.length?safe[0]:win[0]}}
    return applyAction(p,{t:'play',c})}}
const sp=()=>[0,1100,700,350][speed];
async function runAI(){if(busyAI||NET.mode==='guest')return;busyAI=true;
  try{while(G&&!G.over&&G.cur>=0&&!G.players[G.cur].human&&['cut','decide','exchange','play'].includes(G.phase)){await sleep(sp());if(!G||G.cur<0||G.players[G.cur].human)break;aiAct(G.cur);save();sync();render()}}
  finally{busyAI=false}}

  else if(G.phase==='exchange'){const isD=ME===G.dealer,canUp=isD&&G.up&&!G.upTaken,maxS=Math.min(G.stock.length,isD?2:3),max=maxS+(canUp&&takeUp?1:0);

  $('mNew').onclick=()=>{closeSheet();netReset();showStart()};$('mClose').onclick=closeSheet}
$('bMenu').onclick=openMenu;

/* ================= Ticker, Ton, Speichern ================= */
function tick(msg,cls){const el=document.createElement('div');el.className='tick '+(cls||'');el.innerHTML=msg;const tk=$('ticker');tk.appendChild(el);while(tk.children.length>3)tk.firstChild.remove();setTimeout(()=>el.remove(),6000)}
function tickAll(msg,cls){tick(msg,cls);netSend({type:'tick',msg,cls})}
let soundOn=true,AC=null;
function sfx(t){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;
  const tone=(f,d,w='triangle',v=.06,dl=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f,n+dl);g.gain.setValueAtTime(v,n+dl);g.gain.exponentialRampToValueAtTime(.0001,n+dl+d);o.connect(g).connect(AC.destination);o.start(n+dl);o.stop(n+dl+d)};
  if(t==='card'){const b=AC.createBuffer(1,AC.sampleRate*.06,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)*.35;const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start()}
  else if(t==='win')[523,659,784,1046].forEach((f,k)=>tone(f,.3,'triangle',.07,k*.12));
  else if(t==='lose')[392,330,262].forEach((f,k)=>tone(f,.2,'sawtooth',.05,k*.12));}catch(e){}}
const SAVE='watten_save_v1';
function save(){if(!G||NET.mode)return;try{localStorage.setItem(SAVE,JSON.stringify({G,speed}))}catch(e){}}
function hasSave(){try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');return !!s&&!s.G.over}catch(e){return false}}

/* ================= Online (live, direkt zwischen den Geräten) ================= */
const NET={mode:null,peer:null,conns:new Map(),lobby:[],hostConn:null,code:'',nick:'',rid:0,wait:{},started:false,lost:false,seen:0,aiCount:1};
const PFX='watten-v1-';
function peerOpts(){const u=new URLSearchParams(location.search),o={debug:0};if(u.get('peerhost')){o.host=u.get('peerhost');o.port=+u.get('peerport')||9000;o.path='/';o.secure=false}return o}
function loadPeer(){return window.Peer?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
function redact(seat){const g=JSON.parse(JSON.stringify(G));g.hands=g.hands.map((h,i)=>i===seat?h:h.map(()=>0));g.stock=g.stock.map(()=>0);g.deck=[];g.disc=[];return g}
function sync(){if(NET.mode!=='host'||!G)return;for(const[seat,c]of NET.conns){if(!c.open)continue;const s=JSON.stringify(redact(seat));if(s===c._last)continue;c._last=s;c.send({type:'state',s})}}
function netSend(m){if(NET.mode==='host')for(const c of NET.conns.values())if(c.open)c.send(m)}
function netReset(){try{if(NET.peer)NET.peer.destroy()}catch(e){}Object.assign(NET,{mode:null,peer:null,conns:new Map(),lobby:[],hostConn:null,code:'',rid:0,wait:{},started:false,lost:false,seen:0})}
setInterval(()=>{const now=Date.now();
  if(NET.mode==='host'){for(const[,c]of [...NET.conns]){if(c.open)c.send({type:'ping'});if(now-(c._seen||now)>25000)hostClose(c)}
    if(!NET.started)for(const l of NET.lobby)if(l.conn){if(l.conn.open)l.conn.send({type:'ping'});if(now-(l.conn._seen||now)>25000)hostClose(l.conn)}}
  else if(NET.mode==='guest'&&NET.hostConn&&NET.hostConn.open){NET.hostConn.send({type:'ping'});
    if(NET.started&&now-(NET.seen||now)>25000&&!NET.lost){NET.lost=true;delete sheet.dataset.lock;openSheet(`<h2>🔌 Keine Verbindung</h2><p>Vom Gastgeber kommt gerade nichts an. Sobald die Verbindung wieder da ist, geht es automatisch weiter.</p><button class="btn" id="lsOk" style="width:100%">Zum Start</button>`);$('lsOk').onclick=()=>{closeSheet();netReset();showStart()}}}},3000);
function netError(e){const t=e&&e.type;const msg=t==='peer-unavailable'?'Diesen Raum gibt es nicht (mehr). Stimmt der Code?':t==='unavailable-id'?'Der Raum-Code ist gerade belegt – bitte nochmal versuchen.':t==='browser-incompatible'?'Dieser Browser kann leider nicht online spielen.':'Die Verbindung hat nicht geklappt. Prüfe das Internet und versuche es nochmal.';
  delete sheet.dataset.lock;openSheet(`<h2>🌐 Hoppla</h2><p>${msg}</p><button class="btn gold" id="eOk" style="width:100%">OK</button>`);$('eOk').onclick=()=>{closeSheet();netReset();showStart();onlineMenu()}}
function onlineMenu(code){let nick='';try{nick=localStorage.getItem('dt_nick')||''}catch(e){}
  openSheet(`<h2>🌐 Online mit Freunden</h2><p>Ihr spielt live zusammen – jeder auf seinem eigenen Handy. Bis zu 4 Spieler, freie Plätze übernimmt der Computer.</p>
   <div class="lbl">Dein Spielername</div><input class="txt" id="oNick" maxlength="14" placeholder="z. B. Luke" value="${esc(nick)}">
   <button class="btn gold" id="oHost" style="width:100%;margin:8px 0">🏠 Neuen Raum erstellen</button>
   <div class="lbl">… oder einem Raum beitreten</div><input class="txt" id="oCode" maxlength="5" placeholder="CODE" style="text-transform:uppercase;letter-spacing:4px" value="${esc(code||'')}">
   <button class="btn green" id="oJoin" style="width:100%;margin:8px 0">🚪 Beitreten</button>
   <p class="sm">Tipp: Spielt nur mit Leuten, die ihr kennt – den Code bekommt nur, wem ihr ihn schickt.</p>
   <button class="btn" id="oBack" style="width:100%">Zurück</button>`);
  const getNick=()=>{const n=$('oNick').value.trim().slice(0,14);if(!n){$('oNick').focus();$('oNick').style.borderColor='#e0574a';return null}try{localStorage.setItem('dt_nick',n)}catch(e){}return n};
  $('oHost').onclick=()=>{const n=getNick();if(n)hostRoom(n)};
  $('oJoin').onclick=()=>{const n=getNick(),c=$('oCode').value.trim().toUpperCase();if(!n)return;if(c.length<4){$('oCode').focus();return}joinRoom(c,n)};
  $('oBack').onclick=closeSheet;if(code)setTimeout(()=>$('oNick').focus(),50)}
function connecting(t){sheet.dataset.lock='1';openSheet(`<h2>🌐 ${t}</h2><p>Einen Moment …</p>`)}
async function hostRoom(nick){netReset();connecting('Raum wird erstellt');try{await loadPeer()}catch(e){netError({});return}
  const code=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[ri(31)]).join('');
  Object.assign(NET,{mode:'host',code,nick,lobby:[{nick,conn:null}],aiCount:Math.max(0,pick.n-2)});
  const peer=new Peer(PFX+code,peerOpts());NET.peer=peer;
  peer.on('open',()=>showLobby());peer.on('error',e=>netError(e));
  peer.on('connection',c=>{c.on('data',d=>hostData(c,d));c.on('close',()=>hostClose(c));c.on('error',()=>hostClose(c))})}
const roomLink=()=>location.origin+location.pathname+'?raum='+NET.code;
function showLobby(){if(NET.mode!=='host'||NET.started)return;const L=NET.lobby,maxAI=4-L.length;NET.aiCount=Math.min(NET.aiCount,maxAI);if(L.length+NET.aiCount<2)NET.aiCount=Math.min(1,maxAI);
  sheet.dataset.lock='1';
  openSheet(`<h2>🌐 Dein Raum ist offen</h2><p>Schick deinen Freunden diesen Code oder den Link:</p><div class="code">${NET.code}</div>
   <div class="row"><button class="btn" id="lCopy">📋 Link kopieren</button>${navigator.share?'<button class="btn" id="lShare">📤 Teilen</button>':''}</div>
   <p class="sm" style="word-break:break-all">${roomLink()}</p>
   <div class="lbl">Am Tisch (${L.length}/4)</div>${L.map((l,i)=>`<div class="item"><span style="font-size:20px">${i===0?'👑':'👤'}</span><b>${esc(l.nick)}</b><span class="sm">${i===0?'Gastgeber':'verbunden'}</span></div>`).join('')}
   <div class="lbl">Computer-Spieler dazu</div><div class="seg" id="lAI">${[0,1,2,3].filter(k=>k<=maxAI).map(k=>`<button class="btn ${k===NET.aiCount?'on':''}" data-v="${k}">${k}</button>`).join('')}</div>
   <button class="btn gold" id="lStart" style="width:100%;margin:10px 0 6px" ${L.length+NET.aiCount<2?'disabled':''}>🃏 Spiel starten (${L.length+NET.aiCount} Spieler)</button>
   <button class="btn" id="lCancel" style="width:100%">Raum schließen</button>`);
  $('lCopy').onclick=()=>{try{navigator.clipboard.writeText(roomLink()).then(()=>tick('Link kopiert!','good'),()=>tick('Kopieren ging nicht – Code abschreiben.'))}catch(e){}};
  if($('lShare'))$('lShare').onclick=()=>{navigator.share({title:'Böhmisch Watten',text:`Spiel mit mir Böhmisch Watten! Raum-Code: ${NET.code}`,url:roomLink()}).catch(()=>{})};
  $('lAI').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{NET.aiCount=+b.dataset.v;showLobby()});
  $('lStart').onclick=hostStart;$('lCancel').onclick=()=>{delete sheet.dataset.lock;closeSheet();netReset()}}
function lobbyBroadcast(){const names=NET.lobby.map(l=>l.nick);NET.lobby.forEach(l=>{if(l.conn&&l.conn.open)l.conn.send({type:'lobby',names})})}
function hostStart(){const guests=NET.lobby.slice(1);ME=0;NET.started=true;delete sheet.dataset.lock;closeSheet();$('start').classList.add('hidden');
  newGame(1+guests.length+NET.aiCount,guests.map(g=>g.nick));
  guests.forEach((g,i)=>{NET.conns.set(i+1,g.conn);g.conn._seat=i+1;g.conn.send({type:'start',seat:i+1})});
  sync();render();runAI();sfx('win')}
function hostData(c,d){if(!d||typeof d!=='object')return;c._seen=Date.now();
  if(seatOf(c)<0&&c._seat>0&&G&&!G.over){const P=G.players[c._seat];if(P&&P.wasHuman&&!P.human&&!NET.conns.has(c._seat)){P.human=true;NET.conns.set(c._seat,c);c._last='';sync();tickAll(`🔌 ${nm0(c._seat)} ist wieder da!`,'good');render()}}
  if(d.type==='ping')return;
  if(d.type==='hello'){const nick=String(d.nick||'Gast').slice(0,14);
    if(!NET.started){if(NET.lobby.length>=4){c.send({type:'full'});return}if(NET.lobby.some(l=>l.conn===c))return;NET.lobby.push({nick,conn:c});showLobby();lobbyBroadcast();return}
    const seat=G?G.players.findIndex(P=>P.nick===nick&&P.wasHuman&&!P.human):-1;
    if(seat>0){G.players[seat].human=true;NET.conns.set(seat,c);c._seat=seat;c._last='';c.send({type:'start',seat});sync();tickAll(`🔌 ${nick} ist wieder da!`,'good');render()}
    else c.send({type:'running'});return}
  if(d.type==='act'){const seat=seatOf(c);if(seat<0)return;const r=applyAction(seat,d.a||{});sync();c.send({type:'res',rid:d.rid,r});render();runAI()}}
function seatOf(c){for(const[k,v]of NET.conns)if(v===c)return k;return -1}
function hostClose(c){c._seen=Date.now()+1e12;if(!NET.started){const b=NET.lobby.length;NET.lobby=NET.lobby.filter(l=>l.conn!==c);if(NET.lobby.length!==b){showLobby();lobbyBroadcast()}return}
  const seat=seatOf(c);if(seat<0||!G)return;NET.conns.delete(seat);const P=G.players[seat];
  if(P.human){P.human=false;tickAll(`🔌 ${nm0(seat)} hat die Verbindung verloren – der Computer übernimmt.`,'bad');runAI()}sync();render()}
async function joinRoom(code,nick){netReset();connecting('Verbinde mit Raum '+code);try{await loadPeer()}catch(e){netError({});return}
  Object.assign(NET,{mode:'guest',code,nick});const peer=new Peer(peerOpts());NET.peer=peer;peer.on('error',e=>netError(e));
  peer.on('open',()=>{const c=peer.connect(PFX+code,{reliable:true});NET.hostConn=c;const to=setTimeout(()=>{if(!c.open)netError({})},15000);
    c.on('open',()=>{clearTimeout(to);c.send({type:'hello',nick});guestWait([nick])});
    c.on('data',d=>guestData(d));
    c.on('close',()=>{if(NET.mode==='guest'){delete sheet.dataset.lock;openSheet(`<h2>🔌 Verbindung weg</h2><p>Die Verbindung zum Gastgeber ist abgebrochen. Mit demselben Namen und Code kannst du wieder beitreten – der Computer spielt so lange für dich.</p><button class="btn gold" id="cOk" style="width:100%">Zum Start</button>`);$('cOk').onclick=()=>{closeSheet();netReset();showStart();onlineMenu(code)}}})})}
function guestWait(names){if(NET.started)return;sheet.dataset.lock='1';
  openSheet(`<h2>✅ Verbunden mit Raum ${NET.code}</h2><p>Warte, bis der Gastgeber das Spiel startet …</p><div class="lbl">Am Tisch</div>${names.map((n,i)=>`<div class="item"><span style="font-size:20px">${i===0?'👑':'👤'}</span><b>${esc(n)}</b></div>`).join('')}
   <button class="btn" id="gLeave" style="width:100%;margin-top:8px">Raum verlassen</button>`);$('gLeave').onclick=()=>{delete sheet.dataset.lock;closeSheet();netReset()}}
function guestData(d){if(!d||typeof d!=='object')return;NET.seen=Date.now();if(NET.lost){NET.lost=false;closeSheet()}
  if(d.type==='ping')return;
  if(d.type==='lobby')guestWait(d.names);
  else if(d.type==='full'){delete sheet.dataset.lock;openSheet(`<h2>🌐 Tisch ist voll</h2><p>An diesem Tisch sitzen schon 4 Spieler.</p><button class="btn" id="fOk" style="width:100%">OK</button>`);$('fOk').onclick=()=>{closeSheet();netReset()}}
  else if(d.type==='running'){delete sheet.dataset.lock;openSheet(`<h2>🌐 Spiel läuft schon</h2><p>Hier wird schon gespielt. Wer vorher dabei war, kann mit demselben Namen wieder beitreten.</p><button class="btn" id="rOk" style="width:100%">OK</button>`);$('rOk').onclick=()=>{closeSheet();netReset()}}
  else if(d.type==='start'){ME=d.seat;NET.started=true;overShown=false;handEndShown=-1;delete sheet.dataset.lock;closeSheet();$('start').classList.add('hidden');sfx('win')}
  else if(d.type==='state'){const before=G&&G.trick?G.trick.length:0;G=JSON.parse(d.s);if(G.trick&&G.trick.length>before)sfx('card');if(!myTurn()){marks=new Set();takeUp=false}render()}
  else if(d.type==='res'){const w=NET.wait[d.rid];if(w){delete NET.wait[d.rid];w(d.r||{err:1})}}
  else if(d.type==='tick')tick(d.msg,d.cls)}

/* ================= Start ================= */
let pick={n:3};
function showStart(){$('start').classList.remove('hidden');$('bCont').classList.toggle('hidden',!hasSave())}
function seg(id,f){$(id).querySelectorAll('.btn').forEach(b=>b.onclick=()=>{f(+b.dataset.v);$(id).querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b))})}
seg('segN',v=>pick.n=v);seg('segSp',v=>speed=v);
$('startFan').innerHTML=['HK','S7','E7'].map(c=>cardHTML(c)).join('');
$('bNew').onclick=()=>{netReset();ME=0;$('start').classList.add('hidden');marks=new Set();takeUp=false;newGame(pick.n);save();render();runAI()};
$('bCont').onclick=()=>{try{const s=JSON.parse(localStorage.getItem(SAVE));netReset();ME=0;G=s.G;speed=s.speed||2;overShown=false;handEndShown=G.phase==='handEnd'?G.handNo:-1;
  if(G.phase==='trickShow')finishTrick();$('start').classList.add('hidden');render();runAI();tick('Spielstand geladen.','good')}catch(e){tick('Spielstand konnte nicht geladen werden.','bad')}};
$('bOnline').onclick=()=>onlineMenu();
$('bHelp').onclick=()=>{openSheet(HELP+'<button class="btn" id="hc" style="width:100%">Los geht\'s!</button>');$('hc').onclick=closeSheet};
showStart();
{const rc=new URLSearchParams(location.search).get('raum');if(rc)onlineMenu(rc.toUpperCase().slice(0,5))}
</script>

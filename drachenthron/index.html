<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1622;color:#f3ead7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#1c2b3d,#132132);border-bottom:2px solid #c9a24a}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex:none}
#stats{display:flex;gap:12px;font-size:14px;flex:1;justify-content:center;flex-wrap:wrap;font-weight:700}
.hbtn{background:#2b3f57;border:1px solid #c9a24a;color:#f3ead7;border-radius:10px;min-width:42px;height:38px;font-size:18px;cursor:pointer}
#mapwrap{position:relative;flex:1;min-height:0;background:#12344f;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ticker{position:absolute;left:8px;top:8px;right:60px;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.tick{background:rgba(10,20,30,.82);border-left:4px solid #c9a24a;padding:4px 8px;border-radius:6px;font-size:13px;width:fit-content;max-width:100%;animation:fade 7s forwards}
.tick.bad{border-color:#e0574a}.tick.good{border-color:#5bd27a}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;border-radius:10px;border:1px solid #c9a24a;background:rgba(20,35,52,.85);color:#f3ead7;font-size:22px;font-weight:800;cursor:pointer}
footer{background:#132132;border-top:2px solid #c9a24a;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#phaseInfo{font-size:14px;margin-bottom:6px;min-height:20px;line-height:1.35}
#phaseInfo b{color:#e8c25a}
#actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:46px;border:0;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:800;background:#2b3f57;color:#f3ead7;cursor:pointer}
.btn.gold{background:linear-gradient(#f0cc66,#b8892c);color:#241a05}
.btn.red{background:linear-gradient(#e8665a,#a3291f);color:#fff}
.btn.green{background:linear-gradient(#5bd27a,#22833d);color:#04220c}
.btn:disabled{opacity:.38;cursor:default}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheet.hidden{display:none}
.card{background:#182838;border:2px solid #c9a24a;border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:700px){#sheet{align-items:center}.card{border-radius:18px;border-bottom:2px solid #c9a24a}}
h2{margin:0 0 8px;font-size:20px;color:#e8c25a}
p{margin:6px 0;line-height:1.4;font-size:14px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.vs .side{flex:1;padding:8px;border-radius:10px;background:#21354a;text-align:center;font-size:14px}
.vs .big{font-size:26px;display:block}
.dice{display:flex;gap:8px;justify-content:center;margin:10px 0;min-height:44px;align-items:center}
.die{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-size:22px;font-weight:900;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.die.a{background:#d8483b;color:#fff}.die.d{background:#f3ead7;color:#222}
.die.lose{opacity:.3}
.die sup{position:absolute;top:-7px;right:-7px;font-size:11px;background:#e8c25a;color:#000;border-radius:6px;padding:1px 4px}
.die.roll{animation:shake .25s infinite}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg) scale(1.08)}100%{transform:rotate(-12deg)}}
.result{text-align:center;font-weight:800;min-height:22px;font-size:15px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:#21354a;margin:6px 0}
.item .ic{font-size:28px;width:38px;text-align:center;flex:none}
.item .tx{flex:1;font-size:13px;line-height:1.3}.item .tx b{font-size:15px;display:block;color:#f3ead7}
.item .btn{flex:none;min-width:84px}
.bar{height:8px;border-radius:4px;background:#0d1a26;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
#start{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 25%,#2a4a6b,#08111a 70%);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 16px}
#start .inner{max-width:520px;width:100%;margin:auto}
.title{font-size:38px;font-weight:900;text-align:center;color:#f0cc66;text-shadow:0 3px 0 #6b4a10,0 0 24px rgba(240,204,102,.4);letter-spacing:1px;margin:4px 0 0}
.sub{text-align:center;color:#c8d6e5;margin:2px 0 16px;font-size:15px}
.lbl{font-weight:800;margin:14px 0 6px;color:#e8c25a;font-size:14px}
.facs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fac{padding:10px;border-radius:12px;background:#1b2d40;border:2px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.fac.on{border-color:#f0cc66;background:#26405a}
.fac .em{font-size:24px}
.seg{display:flex;gap:6px}.seg .btn{min-height:42px}
.seg .btn.on{background:linear-gradient(#f0cc66,#b8892c);color:#241a05}
.hidden{display:none!important}
.small{font-size:12px;opacity:.8}
@media(max-height:480px){header{padding:3px 8px}.hbtn{height:32px}#phaseInfo{margin-bottom:4px;font-size:13px}.btn{min-height:38px;padding:6px 10px;font-size:14px}footer{padding:5px 8px}}
#legend{display:flex;flex-wrap:wrap;gap:5px;padding:5px 8px;background:#0f1d2b;border-bottom:1px solid #2b3f57}
.lg{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:#1b2d40;border:2px solid transparent;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.lg.turn{border-color:#f0cc66;box-shadow:0 0 8px rgba(240,204,102,.5)}
.lg.dead{opacity:.4;text-decoration:line-through}
.lg .n{opacity:.8;font-weight:600}
.lg.al{background:#1f4d2e;color:#c9f7d4;border-color:#2f7a45}
.lg .dot{width:12px;height:12px}
ul{padding-left:18px;margin:6px 0}li{margin:3px 0;font-size:14px;line-height:1.35}

const nb4=(j)=>{const x=j%GW,y=(j/GW)|0;return[x>0?j-1:-1,x<GW-1?j+1:-1,y>0?j-GW:-1,y<GH-1?j+GW:-1]};

function labelsFantasy(R,nz){const N=GW*GH;
  const RS=REALMS.map((r,i)=>({i,cx:(POS[i][0]+(R()-.5)*.06)*GW,cy:(POS[i][1]+(R()-.5)*.08)*GH,r:(.14+R()*.035)*GW,ids:[]}));

    let best=-9,bi=-1;for(const r of RS){const f=1-Math.hypot(x-r.cx,(y-r.cy)*1.2)/r.r;if(f>best){best=f;bi=r.i}}

    if(best+(n-.5)*.9+ed>.06)realm[i]=bi;}
  const seeds=[];

    while(mine.length<cnt&&tries<1500){tries++;const a=R()*6.2832,d=Math.sqrt(R())*r.r*.9;
      const x=Math.round(r.cx+Math.cos(a)*d),y=Math.round(r.cy+Math.sin(a)*d/1.2);

      if(mine.some(s=>Math.hypot(s.x-x,s.y-y)<19))continue;mine.push({x,y,realm:r.i});}
    for(const s of mine){s.id=seeds.length;seeds.push(s);r.ids.push(s.id)}}
  const lab=new Int16Array(N).fill(-1);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;if(realm[i]<0)continue;const r=RS[realm[i]];if(!r.ids.length)continue;
    const px=x+(nz(x+400,y)-.5)*18,py=y+(nz(x,y+400)-.5)*18;let bd=1e9,b=-1;
    for(const id of r.ids){const s=seeds[id],d=(s.x-px)**2+(s.y-py)**2;if(d<bd){bd=d;b=id}}lab[i]=b;}
  const size=keepLargest(lab,seeds.length);

  for(let i=0;i<N;i++)if(lab[i]>=0)lab[i]=remap[lab[i]];
  const usedNames=REALMS.map(r=>{const a=r.names.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a});

const pw=(v,P)=>{for(let i=1;i<P.length;i++)if(v<=P[i][0]||i===P.length-1){const[a,A]=P[i-1],[b,B]=P[i];return A+(v-a)*(B-A)/(b-a)}};

function labelsClassic(nz){const N=GW*GH,C=CLASSIC,X=CX,Y=CY,idx={};
  C.terr.forEach((t,i)=>idx[t[0]]=i);

  const polys=C.polys.map(p=>{const pts=p[1].map(([a,b])=>[X(a),Y(b)]);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
    const ids=p[0].split(',').map(n=>idx[n]);return{ids,pts,bb:[x0-4,x1+4,y0-4,y1+4]}});polys.forEach((p,pi)=>p.ids.forEach(id=>T[id].poly=pi));

function genMap(seed,portrait,world){

    const nb=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
    for(const[a,b]of nb){if(a<0||b<0||a>=GW||b>=GH){e=3;continue}const L2=lab[b*GW+a];
      if(L2<0)e=3;else if(L2!==L){e=Math.max(e,T[L2].realm!==t.realm?2:1);if(L2>L){const k=L*1000+L2;pair.set(k,(pair.get(k)||0)+1)}}}
    edge[i]=e;if(e===3&&((x+y)%2===0))t.coast.push([x,y]);}
  // Abstand zur Grenze -> Plakettenposition
  const dist=new Int16Array(N).fill(-1);let q=[];
  for(let i=0;i<N;i++)if(lab[i]>=0&&edge[i]){dist[i]=0;q.push(i)}
  for(let h=0;h<q.length;h++){const j=q[h];for(const k of nb4(j))if(k>=0&&lab[k]>=0&&dist[k]<0){dist[k]=dist[j]+1;q.push(k)}}
  T.forEach(t=>{t.mx=t.sx/t.n;t.my=t.sy/t.n;t.best=-1e9});
  for(let i=0;i<N;i++){const L=lab[i];if(L<0)continue;const t=T[L],x=i%GW,y=(i/GW)|0,s=Math.min(dist[i],9)-.12*Math.hypot(x-t.mx,y-t.my);if(s>t.best){t.best=s;t.bx=x;t.by=y}}
  // Wasser-Tiefe
  const wd=new Int16Array(N).fill(99);q=[];
  for(let i=0;i<N;i++){if(lab[i]>=0)continue;for(const k of nb4(i))if(k>=0&&lab[k]>=0){wd[i]=1;q.push(i);break}}
  for(let h=0;h<q.length;h++){const j=q[h];if(wd[j]>=10)continue;for(const k of nb4(j))if(k>=0&&lab[k]<0&&wd[k]>wd[j]+1){wd[k]=wd[j]+1;q.push(k)}}
  const closest=(a,b,wrap)=>{let bd=1e9,pa,pb;for(const p of T[a].coast)for(const r of T[b].coast){let dx=Math.abs(p[0]-r[0]);if(wrap)dx=Math.min(dx,GW-dx);const d=dx*dx+(p[1]-r[1])**2;if(d<bd){bd=d;pa=p;pb=r}}return{a,b,d:Math.sqrt(bd),pa,pb}};

      const c=closest(t.id,b,true);if(c.pa){c.wrap=Math.abs(c.pa[0]-c.pb[0])>GW/2;sea.push(c)}}
  }else{
    for(const[k,c]of pair)if(c>=3){const a=Math.floor(k/1000),b=k%1000;T[a].adj.push(b);T[b].adj.push(a)}

    const cand=[];

    for(const c of cand){const A=find(isl[c.a]),B=find(isl[c.b]);if(A!==B){uf[A]=B;sea.push(c);linked.add(Math.min(isl[c.a],isl[c.b])+'-'+Math.max(isl[c.a],isl[c.b]))}}

  let LAB=lab,SH=shade,ED=edge,WD=wd,RL=rel,DI=dist;
  if(portrait&&!classic){const W=GW,H=GH,tr=(a,C)=>{const b=new C(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)b[x*H+y]=a[y*W+x];return b};

    T.forEach(t=>{[t.bx,t.by]=[t.by,t.bx];[t.mx,t.my]=[t.my,t.mx]});sea.forEach(c=>{c.pa=[c.pa[1],c.pa[0]];c.pb=[c.pb[1],c.pb[0]]});GW=H;GH=W;}

  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#10304a';ctx.fillRect(0,0,cw,ch);

  {const vg=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*.35,cw/2,ch/2,Math.hypot(cw,ch)*.6);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,8,20,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,cw,ch)}

    const mx=(x1+x2)/2,my=(y1+y2)/2-30;ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
    const ang=Math.atan2(y2-my,x2-mx);ctx.fillStyle=fx.col||'#fff';ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-14*Math.cos(ang-.45),y2-14*Math.sin(ang-.45));ctx.lineTo(x2-14*Math.cos(ang+.45),y2-14*Math.sin(ang+.45));ctx.fill();ctx.restore()}
  // Plaketten

    if(showNames){ctx.font=`700 ${Math.max(9.5,Math.min(13,k*3))}px system-ui`;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(mt.name,x,y-R-7);ctx.fillStyle='#fff';ctx.fillText(mt.name,x,y-R-7)}
    ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
    const gr=ctx.createRadialGradient(x-R*.35,y-R*.45,R*.1,x,y,R);gr.addColorStop(0,`rgb(${Math.min(255,c[0]*1.1+40)|0},${Math.min(255,c[1]*1.1+40)|0},${Math.min(255,c[2]*1.1+40)|0})`);gr.addColorStop(1,`rgb(${c[0]*.45|0},${c[1]*.45|0},${c[2]*.45|0})`);

    const ic=(t.castle?'🏰':'')+(t.mine?'💰':'')+(t.barr?'⛺':'')+(t.kn?'⚔️':'')+(t.dr?'🐉':'');

/* ================= Eingabe ================= */
const pts=new Map();let drag=null,moved=false,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pts.size===1){drag={x:e.offsetX,y:e.offsetY,ox:view.ox,oy:view.oy};moved=false}
  if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,ox:view.ox,oy:view.oy};moved=true}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pts.size===2&&pinch){const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),s=Math.max(1,Math.min(5,pinch.s*d/pinch.d));
    view.ox=pinch.cx-(pinch.cx-pinch.ox)*s/pinch.s;view.oy=pinch.cy-(pinch.cy-pinch.oy)*s/pinch.s;view.s=s;clampView();draw()}
  else if(pts.size===1&&drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.hypot(dx,dy)>8)moved=true;if(moved){view.ox=drag.ox+dx;view.oy=drag.oy+dy;clampView();draw()}}});
function up(e){if(!pts.has(e.pointerId))return;const single=pts.size===1;pts.delete(e.pointerId);if(pts.size<2)pinch=null;
  if(single&&!moved)tapAt(e.offsetX,e.offsetY);if(pts.size===0)drag=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch=null;drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,view.s*(e.deltaY<0?1.2:1/1.2))},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(cw/2,ch/2,view.s*1.4);
document.getElementById('zout').onclick=()=>zoomAt(cw/2,ch/2,view.s/1.4);
document.getElementById('zfit').onclick=fit;

function tapAt(px,py){if(!M)return;const k=base*view.s;let best=-1,bd=22*22;
  M.T.forEach((t,i)=>{const[x,y]=toScr(t.bx,t.by),d=(x-px)**2+(y-py)**2;if(d<bd){bd=d;best=i}});
  if(best<0){const gx=Math.floor((px-view.ox)/k),gy=Math.floor((py-view.oy)/k);if(gx>=0&&gy>=0&&gx<GW&&gy<GH)best=M.lab[gy*GW+gx]}
  if(best>=0)onTerritory(best);else{sel=-1;targets=[];updateUI()}}

/* ================= Spieler-Zug ================= */
function beginHumanTurn(first){G.cur=0;G.phase='reinforce';G.moved=false;G.asked=[];G.got=false;sel=-1;targets=[];
  const inc=income(0);G.pool=inc.tr;G.players[0].gold+=first?0:inc.gold;
  if(!first){tick(`Runde ${G.round}: +${inc.tr} Truppen, +${inc.gold} Gold`+(inc.bon.length?` (Reichsbonus: ${inc.bon.join(', ')})`:''),'good')}
  save();updateUI();}
function onTerritory(i){if(busy||G.over||G.cur!==0)return;const t=G.T[i],mt=M.T[i];
  if(G.phase==='reinforce'){
    if(t.owner===0){sel=i;targets=[];if(G.pool>0){t.troops++;G.pool--;sfx('place')}}
    else{sel=-1;tick(`${mt.name} gehört ${G.players[t.owner].name}.`)}
  }else if(G.phase==='attack'){
    if(sel>=0&&targets.includes(i)){openBattle(sel,i);return}
    if(t.owner===0){sel=i;targets=t.troops>=2?attackTargets(i,0):[];if(t.troops<2)tick('Zum Angreifen brauchst du mindestens 2 Truppen.');else if(!targets.length)tick('Von hier kannst du niemanden angreifen.')}
    else if(allied(0,t.owner)){tick(`${G.players[t.owner].name} ist dein Verbündeter – kein Angriff möglich.`)}
    else{sel=-1;targets=[];tick('Tippe zuerst auf eines deiner Gebiete.')}
  }else if(G.phase==='move'){
    if(G.moved){tick('Du hast diese Runde schon verschoben.');return}
    if(sel>=0&&t.owner===0&&i!==sel&&targets.includes(i)){openMove(sel,i);return}
    if(t.owner===0&&t.troops>=2){sel=i;targets=own(0).filter(j=>j!==i&&connectedOwn(i,j,0))}
    else{sel=-1;targets=[];if(t.owner===0)tick('Hier ist nur 1 Truppe – nichts zu verschieben.')}
  }
  updateUI();}

  document.getElementById('stats').innerHTML=`<span>💰 ${P.gold}</span><span>🗺️ ${own(0).length}/${M.T.length}</span><span>🔄 Runde ${G.round}</span>`+(G.cards?`<span>🃏 ${G.cards[0].length}</span>`:'');

  }else if(G.phase==='attack'){
    h=`<b>2 · Angreifen</b> – `+(sel>=0?(targets.length?`Wähle ein <span style="color:#ff8a7a">rot markiertes</span> Ziel neben <b>${sname}</b>.`:`Von <b>${sname}</b> aus geht kein Angriff.`):'Tippe auf ein eigenes Gebiet mit mind. 2 Truppen.');

  on('aNext',()=>{if(G.phase==='reinforce'){G.phase='attack';tick('⚔️ Angriffsphase! Wähle ein eigenes Gebiet.')}else{G.phase='move'}sel=-1;targets=[];save();updateUI()});

  $('mvOk').onclick=()=>{const n=+$('mv').value;A.troops-=n;B.troops+=n;if($('mKn')&&$('mKn').checked){B.kn=1;A.kn=0}if($('mDr')&&$('mDr').checked){B.dr=1;A.dr=0}
    G.moved=true;sel=-1;targets=[];closeSheet();sfx('place');save();updateUI()};}

function openDiplo(){if(!G)return;const L=leader();let h=`<h2>🤝 Diplomatie</h2><p class="small">Verbündete greifen sich nicht an. Ein Bündnis hält 5 Runden. Wer ein Bündnis bricht, gilt bei allen als Verräter.</p>`;
  G.players.forEach((P,i)=>{if(i===0)return;const F=FACTIONS[P.fac],rel=G.rel[0][i],al=G.ally[0][i];
    const relTxt=rel>40?'freundlich':rel>5?'neutral-gut':rel>-20?'misstrauisch':'feindselig';
    const pct=(rel+100)/2,col=rel>0?'#5bd27a':'#e0574a';
    const allies=G.players.map((Q,j)=>j!==i&&j!==0&&G.ally[i][j]>0?Q.name:null).filter(Boolean);
    h+=`<div class="item"><div class="ic">${F.em}</div><div class="tx"><b style="color:rgb(${F.color})">${P.name}${P.alive?'':' 💀'}${i===L?' 👑':''}</b>
      ${P.alive?`${own(i).length} Gebiete · Stärke ${strength(i)} · ${al?`<b style="display:inline;color:#5bd27a">Bündnis (${al} Runden)</b>`:relTxt}${allies.length?`<br>verbündet mit: ${allies.join(', ')}`:''}
      <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>`:'besiegt'}</div>
      ${P.alive&&G.cur===0&&!busy?(al?`<button class="btn red" data-b="${i}">Brechen</button>`:`<div style="display:flex;flex-direction:column;gap:4px"><button class="btn green" data-p="${i}" ${G.asked.includes(i)?'disabled':''}>Bündnis</button><button class="btn" data-g="${i}" ${G.players[0].gold<20?'disabled':''}>🎁 20 Gold</button></div>`):''}</div>`});
  h+=`<button class="btn" id="dClose" style="width:100%">Schließen</button>`;openSheet(h);$('dClose').onclick=closeSheet;
  card.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;G.asked.push(i);
    const myS=strength(0),hisS=strength(i),L=leader();let sc=G.rel[0][i]+rnd()*40;
    if(L!==0&&L!==i)sc+=25;if(L===0)sc-=30;if(myS>hisS)sc+=10;if(G.diff===2)sc-=10;
    if(sc>35){makeAlly(0,i);sfx('win');tick(`🤝 ${G.players[i].name} nimmt dein Bündnis an!`,'good')}else{relChange(0,i,-3);tick(`❌ ${G.players[i].name} lehnt ab.`,'bad')}
    save();openDiplo();updateUI()});
  card.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const i=+b.dataset.g;G.players[0].gold-=20;G.players[i].gold+=20;relChange(0,i,20);sfx('buy');tick(`🎁 ${G.players[i].name} freut sich über dein Geschenk.`,'good');openDiplo();updateUI()});
  card.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=+b.dataset.b;breakAlly(0,i);tick(`🗡️ Du hast das Bündnis mit ${G.players[i].name} gebrochen!`,'bad');save();openDiplo();updateUI()});}
function cardSets(c){const n=[0,0,0];c.forEach(k=>n[k]++);const r=[];
  if(n[0]&&n[1]&&n[2])r.push({use:[0,1,2],v:10,txt:'je eine'});
  [2,1,0].forEach(k=>{if(n[k]>=3)r.push({use:[k,k,k],v:CARD[k].v,txt:'3× '+CARD[k].name})});
  return r.sort((a,b)=>b.v-a.v);}
function tradeSet(p,st){const c=G.cards[p];st.use.forEach(k=>c.splice(c.indexOf(k),1));return st.v}
function drawCard(p){if(G.cards&&G.got&&G.players[p].alive){const k=ri(3);G.cards[p].push(k);if(p===0)tick(`🃏 Du bekommst eine Risiko-Karte: ${CARD[k].ic} ${CARD[k].name}`,'good')}G.got=false}
function openCards(){const c=G.cards[0],sets=cardSets(c);
  let h=`<h2>🃏 Deine Risiko-Karten</h2><p>Wer in seinem Zug mindestens ein Land erobert, bekommt am Ende eine Karte. Drei passende Karten tauschst du gegen Truppen.</p>
   <div class="dice" style="flex-wrap:wrap">${c.length?c.map(k=>`<div class="die d" style="width:auto;padding:0 10px;font-size:15px">${CARD[k].ic} ${CARD[k].name}</div>`).join(''):'<i>Noch keine Karten</i>'}</div>
   <p class="small">3× 🪖 Infanterie = 4 · 3× 🐎 Kavallerie = 6 · 3× 💣 Artillerie = 8 · je eine = 10 Truppen. Mit 5 Karten musst du tauschen.</p>`;
  sets.forEach((st,i)=>h+=`<button class="btn green" data-s="${i}" style="width:100%;margin:4px 0" ${G.phase!=='reinforce'?'disabled':''}>Eintauschen: ${st.txt} → +${st.v} Truppen</button>`);
  h+=`<button class="btn" id="cClose" style="width:100%;margin-top:6px">Schließen</button>`;
  openSheet(h);$('cClose').onclick=closeSheet;
  card.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const st=sets[+b.dataset.s];G.pool+=tradeSet(0,st);sfx('buy');tick(`🃏 Eingetauscht: +${st.v} Truppen!`,'good');save();openCards();updateUI()});}
function askHuman(text,em){return new Promise(res=>{sheet.dataset.lock='1';openSheet(`<h2>${em||'📜'} Botschaft</h2><p style="font-size:16px">${text}</p>
  <div class="row"><button class="btn green" id="qY">Annehmen</button><button class="btn red" id="qN">Ablehnen</button></div>`);
  $('qY').onclick=()=>{delete sheet.dataset.lock;closeSheet();res(true)};$('qN').onclick=()=>{delete sheet.dataset.lock;closeSheet();res(false)}})}

/* ================= Computer-Gegner ================= */
const sp=()=>[0,520,200,40][speed];
function endHumanTurn(){if(busy)return;drawCard(0);sel=-1;targets=[];busy=true;updateUI();runAIs()}
async function runAIs(){
  for(let p=1;p<G.players.length;p++){if(G.over)return;if(!G.players[p].alive)continue;G.cur=p;updateUI();await aiTurn(p);if(checkOver())return}
  G.round++;
  for(let a=0;a<G.players.length;a++)for(let b=a+1;b<G.players.length;b++){
    if(G.ally[a][b]>0){G.ally[a][b]--;G.ally[b][a]--;if(G.ally[a][b]===0&&(a===0))tick(`⌛ Dein Bündnis mit ${G.players[b].name} ist ausgelaufen.`)}
    G.rel[a][b]=G.rel[b][a]=Math.round(G.rel[a][b]*.95);}
  busy=false;fx=null;beginHumanTurn(false);}
async function aiTurn(p){const P=G.players[p],inc=income(p);P.gold+=inc.gold;let pool=inc.tr;G.got=false;
  if(G.cards){let st;while((st=cardSets(G.cards[p])[0])&&(G.cards[p].length>=5||rnd()<.6)){pool+=tradeSet(p,st);tick(`🃏 ${P.name} tauscht Risiko-Karten gegen +${st.v} Truppen`)}}
  tick(`${FACTIONS[P.fac].em} ${P.name} ist am Zug`);await sleep(sp());
  await aiDiplomacy(p);
  pool+=aiBuy(p);
  aiReinforce(p,pool);draw();await sleep(sp());
  const thr=DIFF[G.diff].thr,col=`rgb(${FACTIONS[P.fac].color})`;
  for(let k=0;k<14;k++){const mv=aiPickAttack(p,thr);if(!mv)break;const def=G.T[mv.t].owner;
    fx={from:mv.f,to:mv.t,col};draw();await sleep(sp()*1.2);relChange(p,def,-6);
    let r;do{r=battleRound(mv.f,mv.t)}while(G.T[mv.t].troops>0&&G.T[mv.f].troops>1&&G.T[mv.f].troops>=G.T[mv.t].troops*.8);
    if(G.T[mv.t].troops<=0){const A=G.T[mv.f],mx=A.troops-1,n=Math.max(Math.min(r.na,mx),enemyNbrs(mv.f,p).length?Math.ceil(mx/2):mx);
      conquer(mv.f,mv.t,n);sfx(def===0?'lose':'hit');if(def===0)tick(`🔥 ${P.name} erobert dein Gebiet ${M.T[mv.t].name}!`,'bad');
      if(checkOver()){fx=null;draw();return}}
    else if(def===0)tick(`🛡️ ${M.T[mv.t].name} hat den Angriff von ${P.name} abgewehrt!`,'good');
    draw();await sleep(sp());}
  fx=null;aiFortify(p);drawCard(p);draw();await sleep(sp()*.5);}
function aiBuy(p){const P=G.players[p],o=own(p);let extra=0;if(!o.length)return 0;
  const front=o.filter(i=>enemyNbrs(i,p).length),inner=o.filter(i=>!enemyNbrs(i,p).length);
  const threat=i=>enemyNbrs(i,p).reduce((s,n)=>s+G.T[n].troops,0);
  for(let k=0;k<4;k++){const mines=o.filter(i=>G.T[i].mine).length,barr=o.filter(i=>G.T[i].barr).length;
    const strong=front.slice().sort((a,b)=>G.T[b].troops-G.T[a].troops)[0];
    const danger=front.filter(i=>!G.T[i].castle).sort((a,b)=>threat(b)-threat(a))[0];
    if(P.gold>=35&&mines<2&&G.round>1){const c=(inner.length?inner:o).find(i=>!G.T[i].mine);if(c!==undefined){G.T[c].mine=1;P.gold-=35;continue}}
    if(P.gold>=40&&danger!==undefined&&threat(danger)>G.T[danger].troops*1.3){G.T[danger].castle=1;P.gold-=40;continue}
    if(P.gold>=60&&strong!==undefined&&!o.some(i=>G.T[i].dr)&&rnd()<.6){G.T[strong].dr=1;P.gold-=60;continue}
    if(P.gold>=25&&strong!==undefined&&!G.T[strong].kn){G.T[strong].kn=1;P.gold-=25;continue}
    if(P.gold>=45&&barr<2&&rnd()<.5){const c=(inner.length?inner:o).find(i=>!G.T[i].barr);if(c!==undefined){G.T[c].barr=1;P.gold-=45;continue}}
    if(P.gold>=15){P.gold-=15;extra+=3;continue}
    break;}
  return extra;}
function realmShare(r,p){return r.ids.filter(id=>G.T[id].owner===p).length/r.ids.length}
function aiReinforce(p,pool){const o=own(p);let front=o.filter(i=>enemyNbrs(i,p).length);if(!front.length)front=o;if(!front.length)return;
  const score=i=>{const en=enemyNbrs(i,p);let th=0,opp=-99,foc=0;
    for(const n of en){th+=G.T[n].troops;opp=Math.max(opp,G.T[i].troops-G.T[n].troops);if(realmShare(M.realms.find(r=>r.ids.includes(n)),p)>=.5)foc=.8}
    return th/(G.T[i].troops+1)+(opp>-4?.6:0)+foc+rnd()*.3;};
  for(let k=0;k<pool;k++){let b=front[0],bs=-1e9;for(const i of front){const s=score(i);if(s>bs){bs=s;b=i}}G.T[b].troops++}}
function aiPickAttack(p,thr){let best=null,bs=0;const L=leader();
  for(const f of own(p)){const A=G.T[f];if(A.troops<3)continue;
    for(const t of attackTargets(f,p)){const D=G.T[t],dv=D.troops+(D.castle?1.5:0);let ratio=(A.troops-1)/dv;if(A.dr)ratio*=1.15;if(A.kn)ratio*=1.1;
      if(ratio<thr)continue;const r=M.realms.find(r=>r.ids.includes(t));let v=ratio+realmShare(r,p)*1.2;
      if(D.owner===L&&L!==p)v+=.4;if(D.owner===0&&G.diff===0)v-=.4;if(D.mine||D.barr)v+=.3;
      if(v>bs){bs=v;best={f,t}}}}
  return best;}
function aiFortify(p){const o=own(p);const inner=o.filter(i=>!enemyNbrs(i,p).length&&G.T[i].troops>1).sort((a,b)=>G.T[b].troops-G.T[a].troops);
  if(!inner.length)return;const src=inner[0];
  const dist=new Map(),q=[];o.forEach(i=>{if(enemyNbrs(i,p).length){dist.set(i,0);q.push(i)}});
  for(let h=0;h<q.length;h++){const x=q[h];for(const n of M.T[x].adj)if(G.T[n].owner===p&&!dist.has(n)){dist.set(n,dist.get(x)+1);q.push(n)}}
  if(!dist.has(src))return;let best=-1,bd=1e9;for(const n of M.T[src].adj)if(G.T[n].owner===p&&dist.has(n)&&dist.get(n)<bd){bd=dist.get(n);best=n}
  if(best>=0&&bd<dist.get(src)){const n=G.T[src].troops-1;G.T[src].troops-=n;G.T[best].troops+=n}}
async function aiDiplomacy(p){const L=leader(),n=G.players.length;
  for(let q=0;q<n;q++){if(q===p||!G.players[q].alive)continue;
    if(allied(p,q)&&q===L&&strength(q)>strength(p)*1.7&&rnd()<.15){breakAlly(p,q);tick(`🗡️ ${G.players[p].name} bricht das Bündnis mit ${G.players[q].name}!`,q===0?'bad':'');return}}
  for(let q=0;q<n;q++){if(q===p||!G.players[q].alive||allied(p,q))continue;
    if(q===0){if(rnd()<.14&&G.rel[p][0]>=-5&&L!==p&&(L!==0||G.rel[p][0]>35)){
        busy=true;const ok=await askHuman(`<b>${G.players[p].name}</b> ${FACTIONS[G.players[p].fac].em} bietet dir ein Bündnis für 5 Runden an. Ihr greift euch dann nicht an.`,'🤝');
        if(ok){makeAlly(p,0);tick(`🤝 Bündnis mit ${G.players[p].name} geschlossen!`,'good');sfx('win')}else{relChange(p,0,-8);tick(`Du hast ${G.players[p].name} abgewiesen.`)}return}}
    else if(L!==p&&L!==q&&G.rel[p][q]>-20&&rnd()<.1){makeAlly(p,q);tick(`🤝 ${G.players[p].name} und ${G.players[q].name} schließen ein Bündnis!`);return}}}

/* ================= Ticker, Sound, Speichern ================= */
function tick(msg,cls){const el=document.createElement('div');el.className='tick '+(cls||'');el.innerHTML=msg;const tk=$('ticker');tk.appendChild(el);while(tk.children.length>4)tk.firstChild.remove();setTimeout(()=>el.remove(),7000)}
let AC=null;
function sfx(type){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const tone=(f,d,w='square',v=.06,dl=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f,t+dl);g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);o.connect(g).connect(AC.destination);o.start(t+dl);o.stop(t+dl+d)};
  if(type==='dice'){for(let k=0;k<4;k++)tone(200+rnd()*300,.05,'square',.04,k*.04)}
  else if(type==='place')tone(520,.08,'triangle',.08);
  else if(type==='buy'){tone(660,.08,'triangle',.08);tone(990,.12,'triangle',.08,.08)}
  else if(type==='conquer'){[392,523,659,784].forEach((f,k)=>tone(f,.18,'sawtooth',.05,k*.09))}
  else if(type==='win'){[523,659,784,1046].forEach((f,k)=>tone(f,.3,'triangle',.07,k*.12))}
  else if(type==='hit')tone(160,.15,'sawtooth',.04);
  else if(type==='lose'){[392,330,262].forEach((f,k)=>tone(f,.2,'sawtooth',.05,k*.12))}
}catch(e){}}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);if(!s)return false;const g=JSON.parse(s);if(!g||g.over)return false;G=g;M=genMap(G.seed,!!G.portrait,G.world||0);if(M.T.length!==G.T.length)return false;return true}catch(e){return false}}
function hasSave(){try{const s=localStorage.getItem(SAVE);return !!s&&!JSON.parse(s).over}catch(e){return false}}

function gameOver(win,txt){G.over=true;save();busy=false;sfx(win?'win':'lose');sheet.dataset.lock='1';
  openSheet(`<div style="text-align:center;font-size:64px">${win?'👑':'💀'}</div><h2 style="text-align:center">${win?'SIEG! Du bist Herrscher von Aetheria!':'Niederlage …'}</h2>
  <p style="text-align:center">${txt}<br>Runde ${G.round}</p><button class="btn gold" id="goNew" style="width:100%">Neues Spiel</button>`);
  $('goNew').onclick=()=>{delete sheet.dataset.lock;closeSheet();showStart()};}

/* ================= Menü & Start ================= */
const HELP=`<h2>📜 So geht's</h2>
<p><b>Ziel:</b> Erobere 65 % aller Gebiete oder besiege alle anderen Völker.</p>
<ul><li><b>1 · Verstärken:</b> Zu Rundenbeginn bekommst du Truppen und Gold. Tippe auf deine Gebiete, um Truppen zu setzen. Mit 🛒 kaufst du Einheiten und Gebäude.</li>
<li><b>2 · Angreifen:</b> Tippe dein Gebiet (mind. 2 Truppen), dann ein rot markiertes Nachbargebiet. Würfelkampf wie bei Risiko.</li>
<li><b>3 · Verschieben:</b> Einmal pro Runde Truppen zwischen verbundenen eigenen Gebieten bewegen.</li>
<li><b>Reiche:</b> Besitzt du ein ganzes Reich (z. B. Frostlande), gibt's jede Runde Bonustruppen 👑.</li>
<li><b>Seewege</b> (gestrichelt) verbinden die Inseln.</li>
<li>⚔️ <b>Ritter</b>: Gleichstand gewinnst du · 🐉 <b>Drache</b>: +1 Angriff, fliegt 2 Felder · 🏰 <b>Burg</b>: +1 Verteidigung · 💰 <b>Mine</b>: +4 Gold · ⛺ <b>Kaserne</b>: +2 Truppen</li>
<li>🤝 <b>Diplomatie:</b> Bündnisse schützen vor Angriffen. Geschenke machen Freunde. Verrat merkt sich jeder!</li>
<li>Eroberst du ein Gebiet, gehören dir auch die Gebäude dort.</li>
<li>🌍 <b>Risiko-Weltkarte:</b> 42 Länder und Kontinent-Boni wie im Original (Asien +7, Nordamerika +5, Europa +5, Afrika +3, Südamerika +2, Australien +2). Dazu Risiko-Karten: Wer erobert, zieht eine Karte – 3 Karten gibt's gegen Truppen.</li></ul>`;
function openMenu(){openSheet(`<h2>☰ Menü</h2>
  <button class="btn" id="mHelp" style="width:100%;margin:4px 0">📜 Spielregeln</button>
  <button class="btn" id="mSound" style="width:100%;margin:4px 0">${soundOn?'🔊 Ton an':'🔇 Ton aus'}</button>
  <button class="btn" id="mSpeed" style="width:100%;margin:4px 0">⏩ Gegner-Tempo: ${['','Normal','Schnell','Turbo'][speed]}</button>
  <button class="btn red" id="mNew" style="width:100%;margin:4px 0">🗺️ Zurück zum Start</button>
  <p class="small">Das Spiel speichert automatisch auf diesem Gerät.</p>
  <button class="btn" id="mClose" style="width:100%">Schließen</button>`);
  $('mHelp').onclick=()=>{openSheet(HELP+'<button class="btn" id="hc" style="width:100%">Schließen</button>');$('hc').onclick=closeSheet};
  $('mSound').onclick=()=>{soundOn=!soundOn;openMenu()};$('mSpeed').onclick=()=>{speed=speed%3+1;openMenu();updateUI()};
  $('mNew').onclick=()=>{if(busy){tick('Warte, bis die Gegner fertig sind.');return}closeSheet();showStart()};$('mClose').onclick=closeSheet;}
$('bMenu').onclick=openMenu;$('bDip').onclick=openDiplo;

let pick={fac:0,opp:3,diff:1,world:0};
function showStart(){$('start').classList.remove('hidden');$('bCont').classList.toggle('hidden',!hasSave());
  $('facs').innerHTML=FACTIONS.map((F,i)=>`<div class="fac ${i===pick.fac?'on':''}" data-f="${i}"><span class="em">${F.em}</span><span class="dot" style="background:rgb(${F.color})"></span>${F.name}</div>`).join('');
  $('facs').querySelectorAll('.fac').forEach(el=>el.onclick=()=>{pick.fac=+el.dataset.f;showStart()});}
function seg(id,key){$(id).querySelectorAll('.btn').forEach(b=>b.onclick=()=>{pick[key]=+b.dataset.v;$(id).querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b))})}
seg('segOpp','opp');seg('segDiff','diff');seg('segWorld','world');
$('bNew').onclick=()=>{$('start').classList.add('hidden');newGame(pick.fac,pick.opp,pick.diff,pick.world);resize();fit();sfx('win');tick('🐉 Willkommen in Aetheria! Setze deine Truppen.','good')};
$('bCont').onclick=()=>{if(load()){$('start').classList.add('hidden');busy=false;sel=-1;targets=[];
  if(G.cur!==0){G.round++;beginHumanTurn(false)}resize();fit();updateUI();tick('Spielstand geladen.','good')}};
$('bHelp').onclick=()=>{openSheet(HELP+'<button class="btn" id="hc" style="width:100%">Los geht\'s!</button>');$('hc').onclick=closeSheet};
showStart();
</script>
